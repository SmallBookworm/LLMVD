rules:
  - id: libevent-evbuffer-integer-overflow
    patterns:
      - pattern: |
          if (buf->freeze_end) {
              goto done;
          }
          ...
          buf->total_len += ...;
    pattern-not: |
        if (buf->freeze_end) {
            goto done;
        }
        if (... > EV_SIZE_MAX - buf->total_len) {
            goto done;
        }
        ...
        buf->total_len += ...;
    message: "Missing integer overflow check before updating buf->total_len in evbuffer_add. This may lead to heap-based buffer overflow or infinite loop (CVE-2014-6272)."
    severity: ERROR
    languages: [c]
    metadata:
      cwe: "CWE-189"
      references:
        - https://github.com/libevent/libevent/commit/841ecbd96105c84ac2e7c9594aeadbcc6fb38bc4
        - https://nvd.nist.gov/vuln/detail/CVE-2014-6272