rules:
  - id: cve-2012-2143-crypt-des-null-byte-truncation
    message: "DES-based crypt function may truncate password at 0x80 byte, leading to weakened authentication (CVE-2012-2143)."
    severity: HIGH
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              while (q - (u_char *) keybuf < sizeof(keybuf)) {
                if ((*q++ = *key << 1))
                  key++;
              }
          - pattern: |
              while (q - (u_char *) keybuf < sizeof(keybuf)) {
                if ((*q++ = *key << 1))
                    key++;
              }
    metadata:
      cwe: "CWE-310"
      cve: "CVE-2012-2143"