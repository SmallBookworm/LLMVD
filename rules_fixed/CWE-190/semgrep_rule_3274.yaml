rules:
  - id: jasper_double_free_cwe_190
    message: "Potential integer overflow leading to double free vulnerability (CWE-190) due to use of int instead of jas_matind_t in jas_seq2d_create parameters."
    severity: ERROR
    languages: [c]
    pattern: |
      jas_matrix_t *jas_seq2d_create(int xstart, int ystart, int xend, int yend);
    fix: jas_matrix_t *jas_seq2d_create(jas_matind_t xstart, jas_matind_t ystart, jas_matind_t xend, jas_matind_t yend);