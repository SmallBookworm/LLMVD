rules:
  - id: freetype-t1_builder_close_contour-oob-write
    message: "Detected vulnerable pattern in t1_builder_close_contour that may lead to heap-based buffer overflow (CVE-2017-8287, CWE-119)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if ( outline->n_points > 1 )
            if ( p1->x == p2->x && p1->y == p2->y )
              if ( *control == FT_CURVE_TAG_ON )
                outline->n_points--;
      - pattern: |
          if ( outline->n_contours && first == outline->n_points )
          {
            outline->n_contours--;
            return;
          }
    metavariable-patterns:
      - metavariable: $p1
        pattern: "outline->points + first"
      - metavariable: $p2
        pattern: "outline->points + outline->n_points - 1"
      - metavariable: $control
        pattern: "(FT_Byte*)outline->tags + outline->n_points - 1"