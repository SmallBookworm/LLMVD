rules:
  - id: cve-2019-13219-null-deref-get-window
    message: "Potential NULL pointer dereference due to missing return after assert(0). In vulnerable versions, assert(0) may be disabled in release builds, leading to unexpected NULL return without proper handling."
    severity: ERROR
    languages: [c]
    pattern: |
      if (...) return ...;
      if (...) return ...;
      assert(0);
      return NULL;
    metadata:
      cwe: ["CWE-20"]
      references:
        - https://github.com/nothings/stb/commit/98fdfc6df88b1e34a736d5e126e6c8139c8de1a6
        - https://nvd.nist.gov/vuln/detail/CVE-2019-13219