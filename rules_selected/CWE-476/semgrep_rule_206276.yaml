rules:
  - id: cwe-476-null-pointer-dereference-mpegts-pat-parsing
    message: "Potential NULL pointer dereference due to unsafe loop condition in PAT parsing. Use bounded loop based on nb_programs instead of pointer comparison to avoid over-read."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              while ($DATA < $END - 4) {
                ...
                g_ptr_array_index($PAT, $I) = ...;
                $I++;
              }
    metadata:
      cwe: "CWE-476"
      cve: "CVE-2016-9813"