rules:
  - id: cve-2019-8906-oob-read-memcpy
    message: "Out-of-bounds read vulnerability due to unsafe memcpy usage. Ensure the copy size does not exceed the destination buffer size."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern: |
          memcpy(&$X, $SRC, $SIZE);
    pattern-not: |
          memcpy(&$X, $SRC, MIN($SIZE, sizeof($X)));
    metavariable-pattern:
      metavariable: $X
      pattern: struct NetBSD_elfcore_procinfo
    fix-regex:
      regex: ""
      replacement: ""