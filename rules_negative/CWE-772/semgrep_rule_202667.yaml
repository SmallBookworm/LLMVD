rules:
  - id: imagemagick-xpm-memory-leak-cve-2017-17680
    message: "Memory leak in ReadXPMImage due to missing cleanup on SetImageExtent failure (CVE-2017-17680, CWE-772)."
    severity: ERROR
    languages: [c]
    pattern: |
      if (status == MagickFalse)
        return(DestroyImageList(image));