rules:
  - id: cve-2017-13185-information-disclosure
    message: "Potential information disclosure due to uninitialized memory in slice data parsing. Sensitive data might be exposed when handling erroneous slices."
    severity: WARNING
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              if (ret != (IHEVCD_ERROR_T)IHEVCD_SUCCESS)
              {
                  /* Reset tu and pu parameters, and signal current ctb as skip */
                  WORD32 pu_skip_wd, pu_skip_ht;
                  WORD32 rows_remaining, cols_remaining;
                  WORD32 tu_coeff_data_reset_size;
                  ...
                  memset(pu1_tu_coeff_data, 0, tu_coeff_data_reset_size);
                  ...
              }
          - pattern: |
              if (ret != (IHEVCD_ERROR_T)IHEVCD_SUCCESS)
              {
                  /* Reset tu and pu parameters, and signal current ctb as skip */
                  WORD32 tu_coeff_data_reset_size;
                  ...
                  memset(pu1_tu_coeff_data, 0, tu_coeff_data_reset_size);
                  ...
              }
    metadata:
      cwe: "CWE-200"
      cve: "CVE-2017-13185"
      references:
        - "https://android.googlesource.com/platform/external/libhevc/+/2b9fb0c2074d370a254b35e2489de2d94943578d"