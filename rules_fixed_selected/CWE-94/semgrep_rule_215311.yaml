rules:
  - id: missing_access_ok_check
    patterns:
      - pattern-either:
          - pattern: |
              if (unlikely(!base))
                  break;
          - pattern: |
              if (!base)
                  break;
    pattern-not: |
      if (!access_ok(VERIFY_READ, base, len))
          break;
    message: "Missing access_ok() validation of user pointer 'base' before use. This can lead to arbitrary kernel memory dereference (CWE-94)."
    severity: ERROR
    languages: [c]
    metadata:
      cwe: "CWE-94"
      cve: "CVE-2008-0600"