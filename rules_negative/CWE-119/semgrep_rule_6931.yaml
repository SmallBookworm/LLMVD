rules:
  - id: libpng-palette-buffer-overflow
    message: "Potential buffer overflow in png_set_PLTE due to unchecked palette length against bit-depth-derived limit. Upgrade libpng to version >= 1.0.64, 1.2.54, 1.4.17, 1.5.24, or 1.6.19."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if (num_palette < 0 || num_palette > PNG_MAX_PALETTE_LENGTH)
          {
            ...
          }
      - pattern: |
          if (num_palette < 0 || num_palette > (int) PNG_MAX_PALETTE_LENGTH)
          {
            ...
          }
    metavariable-regex:
      metavariable: $FUNC
      regex: png_set_PLTE