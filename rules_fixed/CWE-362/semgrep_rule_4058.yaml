rules:
  - id: coredump_race_condition_missing_mmget_still_valid
    message: "Missing mmget_still_valid() check after acquiring mmap_sem for writing, which may lead to a race condition with core dumping (CWE-362)."
    severity: WARNING
    languages: [c]
    pattern-either:
      - pattern: |
          if (down_write_killable(&$MM->mmap_sem)) {
            ...
          }
          ...
          if (!mmget_still_valid($MM)) {
            ...
            up_write(&$MM->mmap_sem);
            ...
          }
      - pattern: |
          down_write_killable(&$MM->mmap_sem)
          ...
          if (!mmget_still_valid($MM)) {
            ...
            up_write(&$MM->mmap_sem);
            ...
          }
    pattern-not-inside: |
      if (down_write_killable(&$MM->mmap_sem)) {
        ...
      }
      ...
      if (!mmget_still_valid($MM)) {
        ...
        up_write(&$MM->mmap_sem);
        ...
      }
      ...
    fix-regex:
      regex: ""
      replacement: ""
    metadata:
      cwe: ["CWE-362"]
      cve: ["CVE-2019-11599"]