rules:
  - id: magicmouse-buffer-overflow
    message: "Missing sanity check on report size in magicmouse_raw_event may lead to buffer overflow (CVE-2014-3181)."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              if (size < 4 || ((size - 4) % 9) != 0)
                return 0;
              npoints = (size - 4) / 9;
              ...
              for (...; ...; ...)
                magicmouse_emit_touch(..., ..., data + ...);
          - pattern: |
              if (size < 6 || ((size - 6) % 8) != 0)
                return 0;
              npoints = (size - 6) / 8;
              ...
              for (...; ...; ...)
                magicmouse_emit_touch(..., ..., data + ...);
    metavariable-regex:
      metavariable: $npoints
      regex: npoints