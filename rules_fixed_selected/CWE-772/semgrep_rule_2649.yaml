rules:
  - id: imagemagick-mat-memory-leak-cve-2017-12667
    message: "Memory leak vulnerability in ReadMATImage due to missing cleanup of clone_info before throwing exception (CVE-2017-12667, CWE-772)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if (strncmp($HDR, "MATLAB", 6))
          MATLAB_KO: ThrowReaderException($ERR1, $ERR2);
      - pattern: |
          if (strncmp($HDR, "MATLAB", 6))
            goto MATLAB_KO;
          ...
          MATLAB_KO: ThrowReaderException($ERR1, $ERR2);