rules:
  - id: imagemagick-mpc-memory-leak-cve-2017-5507
    message: "Missing resource limit check before pixel cache allocation may lead to memory exhaustion (CVE-2017-5507, CWE-772)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if (image->storage_class == PseudoClass)
            {
              ...
              if (AcquireImageColormap(image, image->colors) == MagickFalse)
                ...
            }
      - pattern: |
          if (image->storage_class == PseudoClass)
            {
              ...
              image->colormap=(PixelPacket *) AcquireQuantumMemory(image->colors,
                sizeof(*image->colormap));
              ...
            }
    metavariable-comparison:
      metavariable: $image->colors
      comparison: "> 0"