rules:
  - id: bpf_vmlinux_btf_usage
    message: "Usage of vmlinux BTF in map_create without kernel BTF check may lead to system crash (CVE-2021-29648)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if (attr->btf_key_type_id || attr->btf_value_type_id || attr->btf_vmlinux_value_type_id) {
            ...
            btf = btf_get_by_fd(attr->btf_fd);
            ...
            map->btf = btf;
            ...
          }
      - pattern: |
          if (attr->btf_key_type_id || attr->btf_value_type_id || attr->btf_vmlinux_value_type_id) {
            ...
            btf = btf_get_by_fd(attr->btf_fd);
            ...
            if (IS_ERR(btf)) { ... }
            ...
            map->btf = btf;
            ...
          }
    pattern-not: |
      if (attr->btf_key_type_id || attr->btf_value_type_id || attr->btf_vmlinux_value_type_id) {
        ...
        btf = btf_get_by_fd(attr->btf_fd);
        ...
        if (btf_is_kernel(btf)) {
          ...
          btf_put(btf);
          ...
          goto ...;
        }
        ...
        map->btf = btf;
        ...
      }