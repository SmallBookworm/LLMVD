rules:
  - id: cve-2016-0728-keyring-ref-leak
    message: "Missing key_put() when joining existing session keyring may cause reference leak (CVE-2016-0728)."
    severity: ERROR
    languages: [c]
    pattern: |
      if (keyring == new->session_keyring) {
        ret = 0;
        goto error2;
      }
    metadata:
      cwe: ["CWE-703"]
      references:
        - https://github.com/torvalds/linux/commit/23567fd052a9abb6d67fe8e7a9ccdd9800a540f2
        - https://nvd.nist.gov/vuln/detail/CVE-2016-0728