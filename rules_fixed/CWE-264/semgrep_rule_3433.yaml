rules:
  - id: filesystem_stacking_depth_check_missing
    message: Missing filesystem stacking depth check in overlayfs fill_super function. This may allow privilege escalation via deep filesystem stacking (CVE-2014-9922).
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          sb->s_stack_depth = max(..., ...) + 1;
          ...
          if (sb->s_stack_depth > FILESYSTEM_MAX_STACK_DEPTH) {
              ...
              goto ...;
          }
      - pattern: |
          sb->s_stack_depth = max(..., ...) + 1;
          ...
          if (sb->s_stack_depth > $MAX) {
              ...
              goto ...;
          }
    pattern-not-inside: |
      $FUNC(...) {
          ...
          sb->s_stack_depth = max(..., ...) + 1;
          ...
          if (sb->s_stack_depth > ...) {
              ...
              goto ...;
          }
          ...
      }
    metadata:
      fix-regex:
        enabled: false