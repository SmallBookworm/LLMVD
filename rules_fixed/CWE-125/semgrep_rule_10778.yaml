rules:
  - id: cve-2017-7277-skb-err-queue-missing-mark
    message: "Missing call to skb_set_err_queue() before queuing skb to sk_error_queue may lead to out-of-bounds read in __sock_recv_timestamp (CVE-2017-7277, CWE-125)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          skb_queue_tail(&sk->sk_error_queue, $SKB);
      - pattern: |
          skb_queue_tail(&$SK->sk_error_queue, $SKB);
    pattern-not: |
      skb_set_err_queue($SKB);
      ...
      skb_queue_tail(&$SK->sk_error_queue, $SKB);
    fix: ""