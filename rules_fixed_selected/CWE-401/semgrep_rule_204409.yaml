rules:
  - id: memory-leak-create-resource-pool
    patterns:
      - pattern-either:
          - pattern: |
              if (construct(..., ..., $POOL))
                  return &$POOL->base;
              ...
              return NULL;
          - pattern: |
              if (construct(..., ..., $POOL))
                  return &$POOL->base;
              BREAK_TO_DEBUGGER();
              return NULL;
    message: "Memory leak detected: allocated memory in create_resource_pool is not freed on failure path."
    severity: ERROR
    languages: [c]
    metadata:
      cwe: "CWE-401"
      references:
        - "https://github.com/torvalds/linux/commit/104c307147ad379617472dd91a5bcb368d72bd6d"
        - "https://nvd.nist.gov/vuln/detail/CVE-2019-19082"