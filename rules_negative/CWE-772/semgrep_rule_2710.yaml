rules:
  - id: imagemagick-screenshot-memory-leak-cve-2017-11447
    message: "Memory leak in ReadSCREENSHOTImage due to improper error handling before SetImageExtent. Resources may not be freed if SetImageExtent fails."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          screen=AcquireImage(...);
          ...
          screen->columns=...;
          screen->rows=...;
          screen->storage_class=...;
          status=SetImageExtent(screen,...);
          if (status == MagickFalse)
            {
              InheritException(...,&image->exception);
              return(DestroyImageList(image));
            }
          if (image == (Image *) NULL)
            image=screen;
          else
            AppendImageToList(&image,screen);