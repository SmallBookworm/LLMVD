rules:
  - id: cve-2015-0204-freak-attack
    message: "Ephemeral RSA keys are allowed in non-export ciphersuites, which could lead to a FREAK attack (CVE-2015-0204)."
    severity: ERROR
    languages: [c]
    pattern: |
      if (alg_k & SSL_kRSA)
        {
        if ((rsa=RSA_new()) == NULL)
          {
          ...
          }
        ...
        s->session->sess_cert->peer_rsa_tmp=rsa;
        ...
        }
    pattern-not: |
      if (alg_k & SSL_kRSA)
        {
        if (!SSL_C_IS_EXPORT(s->s3->tmp.new_cipher))
          {
          ...
          }
        if ((rsa=RSA_new()) == NULL)
          {
          ...
          }
        ...
        s->session->sess_cert->peer_rsa_tmp=rsa;
        ...
        }
    mode: search