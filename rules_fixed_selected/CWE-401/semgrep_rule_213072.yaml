rules:
  - id: imagemagick-readpsimage-memory-leak-cve-2019-13137
    message: "Memory leak in ReadPSImage due to missing handling of 'eps:fit-page' option before ImageMagick 7.0.8-50."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              if (*image_info->magick == 'E')
                {
                  option=GetImageOption(image_info,"eps:use-cropbox");
                  if ((option == (const char *) NULL) ||
                      (IsStringTrue(option) != MagickFalse))
                    (void) ConcatenateMagickString(options,"-dEPSCrop ",MaxTextExtent);
                }
          - pattern: |
              if ((*image_info->magick == 'E') && ((option == (const char *) NULL) || 
                  (IsStringTrue(option) != MagickFalse)))
                (void) ConcatenateMagickString(options,"-dEPSCrop ",MaxTextExtent);
    metadata:
      cwe: ["CWE-401"]
      cve: "CVE-2019-13137"