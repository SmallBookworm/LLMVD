rules:
  - id: php-cve-2016-6289-integer-overflow
    message: "Integer overflow vulnerability in virtual_file_ex due to missing check for zero-length path. This can lead to buffer overflow (CVE-2016-6289, CWE-190)."
    severity: ERROR
    languages: [c]
    pattern: |
      if (path_length == 0 || path_length >= MAXPATHLEN-1) {
      ...
      }