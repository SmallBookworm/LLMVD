rules:
  - id: imagemagick-readonejngimage-memory-leak
    message: Memory leak in ReadOneJNGImage due to missing error handling after AcquireQuantumMemory.
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          chunk=(unsigned char *) AcquireQuantumMemory(...);
          if (chunk == (unsigned char *) NULL)
            ThrowReaderException(...);
      - pattern: |
          chunk=(unsigned char *) AcquireQuantumMemory(...);
          if (chunk == (unsigned char *) NULL)
            {
              ...
            }
    metavariable-pattern:
      metavariable: chunk
      pattern: (unsigned char *) AcquireQuantumMemory(...)