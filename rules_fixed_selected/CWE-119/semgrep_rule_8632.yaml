rules:
  - id: cve-2017-0539-libhevc-sps-buffer-validation
    message: Missing validation of max_dec_pic_buffering and num_reorder_pics in SPS parsing may lead to buffer overflows (CWE-119).
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          ps_sps->ai1_sps_max_dec_pic_buffering[$I] = $VALUE + 1;
          ...
          ps_sps->ai1_sps_max_num_reorder_pics[$I] = $VALUE2;
      - pattern: |
          ps_sps->ai1_sps_max_dec_pic_buffering[$I] = $VALUE + 1;
          ...
          if (ps_sps->ai1_sps_max_num_reorder_pics[$I] > ps_sps->ai1_sps_max_dec_pic_buffering[$I])
          {
              return IHEVCD_INVALID_PARAMETER;
          }
    metavariable-pattern:
      $I: 
        pattern-regex: "[i]"
    pattern-not-inside: |
      ps_sps->ai1_sps_max_dec_pic_buffering[$I] = $VALUE + 1;
      ...
      if (ps_sps->ai1_sps_max_dec_pic_buffering[$I] > MAX_DPB_SIZE)
      {
          return IHEVCD_INVALID_PARAMETER;
      }
      ...
      ps_sps->ai1_sps_max_num_reorder_pics[$I] = $VALUE2;
      ...
      if (ps_sps->ai1_sps_max_num_reorder_pics[$I] > ps_sps->ai1_sps_max_dec_pic_buffering[$I])
      {
          return IHEVCD_INVALID_PARAMETER;
      }