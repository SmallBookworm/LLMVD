rules:
  - id: cwe-476-null-pointer-dereference-bmp-decoder
    message: "Potential NULL pointer dereference due to missing null check before use in BMP decoder. This may lead to denial of service (CWE-476)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          $PTR = bmp_getinfo(...);
          if (!($PTR)) {
            ...
            return 0;
          }
          ...
          $PTR->...
      - pattern: |
          if (bmp_getdata(..., ..., ...)) {
            ...
            return 0;
          }
    metadata:
      cwe: "CWE-476"
      cve: "CVE-2016-8690"