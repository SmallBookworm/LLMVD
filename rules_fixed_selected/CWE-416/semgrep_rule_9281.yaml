rules:
  - id: cve-2014-0131-use-after-free
    message: "Use-after-free vulnerability in skb_segment due to missing skb_orphan_frags call before copying frags. This may allow attackers to access freed memory."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          while (... < ... + ...) {
            ...
            if (i >= nfrags) {
              ...
              frag = skb_shinfo(list_skb)->frags;
              ...
            }
            ...
            *nskb_frag = *frag;
            __skb_frag_ref(nskb_frag);
            ...
          }
      - pattern: |
          while (... < ... + ...) {
            ...
            if (i >= nfrags) {
              ...
              frag = skb_shinfo(list_skb)->frags;
              ...
            }
            ...
            if (unlikely(skb_shinfo(nskb)->nr_frags >= MAX_SKB_FRAGS)) {
              ...
              goto err;
            }
            ...
            *nskb_frag = *frag;
            __skb_frag_ref(nskb_frag);
            ...
          }
    pattern-not: |
      while (... < ... + ...) {
        ...
        if (i >= nfrags) {
          ...
          frag = skb_shinfo(list_skb)->frags;
          frag_skb = list_skb;
          ...
        }
        ...
        if (unlikely(skb_orphan_frags(frag_skb, ...)))
          goto err;
        ...
        *nskb_frag = *frag;
        __skb_frag_ref(nskb_frag);
        ...
      }