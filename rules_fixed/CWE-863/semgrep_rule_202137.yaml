rules:
  - id: kvm-x2apic-vtpr-read-intercept-missing
    message: "Missing read intercept disable for x2APIC VTPR MSR in nested virtualization may allow L1 guest to access L0's APIC register values, leading to DoS (CVE-2019-3887)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if (nested_cpu_has_virt_x2apic_mode(vmcs12)) {
              ...
              nested_vmx_disable_intercept_for_msr(
                  msr_bitmap_l1, msr_bitmap_l0,
                  X2APIC_MSR(APIC_TASKPRI),
                  MSR_TYPE_W);
              ...
          }
      - pattern: |
          if (nested_cpu_has_virt_x2apic_mode(vmcs12)) {
              ...
              nested_vmx_disable_intercept_for_msr(
                  msr_bitmap_l1, msr_bitmap_l0,
                  X2APIC_MSR(APIC_TASKPRI),
                  $type);
              ...
          }
    metavariable-pattern:
      $type:
        patterns:
          - pattern-not: MSR_TYPE_R
          - pattern-not: MSR_TYPE_W