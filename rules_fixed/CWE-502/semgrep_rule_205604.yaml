    message: "Potential out-of-bounds read in xmlBufAttrSerializeTxtContent due to missing null-byte checks when handling non-UTF-8 attribute values."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if ((*cur >= 0x80) && ((doc == NULL) || (doc->encoding == NULL))) {
      - pattern: |
          } else if ((*cur < 0xF0)) {
      - pattern: |
          } else if ((*cur < 0xF8)) {