rules:
  - id: opus_decode_float_missing_error_check
    patterns:
      - pattern-either:
          - pattern: |
              $DECODedsamples = opus_decode_float(...);
              ...
              for (int i = 0; i < $DECODedsamples; ++i) { ... }
          - pattern: |
              $DECODedsamples = opus_decode_float(...);
              ...
              pow += pOut[$DECODedsamples] * pOut[$DECODedsamples];
          - pattern: |
              $DECODedsamples = opus_decode_float(...);
              ...
              static_cast<float>($DECODedsamples)
          - pattern: |
              $DECODedsamples = opus_decode_float(...);
              ...
              $DECODedsamples / ...
          - pattern: |
              $DECODedsamples = opus_decode_float(...);
              ...
              $DECODedsamples * ...
    message: "Missing error check for opus_decode_float return value. Negative return values can lead to integer underflow and buffer over-read/write (CWE-189)."
    severity: ERROR
    languages: [c]
    metadata:
      cwe: "CWE-189"
      cve: "CVE-2014-0045"