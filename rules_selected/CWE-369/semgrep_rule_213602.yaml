rules:
  - id: cve-2020-12652-double-fetch
    message: "Potential double fetch vulnerability in ioctl handler. The 'iocp' pointer is resolved before locking, but user-controlled data is fetched again after locking, possibly leading to a race condition (CWE-369)."
    severity: WARNING
    languages: [c]
    pattern-either:
      - pattern: |
          if ((ret = mptctl_syscall_down($IOC, $NONBLOCK)) != 0)
                  return ret;
          ...
          mptctl_fw_download($ARG);
      - pattern: |
          if ((ret = mptctl_syscall_down($IOC, $NONBLOCK)) != 0)
                  return ret;
          ...
          mptctl_mpt_command($ARG);
      - pattern: |
          if ((ret = mptctl_syscall_down($IOC, $NONBLOCK)) != 0)
                  return ret;
          ...
          mptctl_do_reset($ARG);
      - pattern: |
          if ((ret = mptctl_syscall_down($IOC, $NONBLOCK)) != 0)
                  return ret;
          ...
          mptctl_hp_hostinfo($ARG, ...);
      - pattern: |
          if ((ret = mptctl_syscall_down($IOC, $NONBLOCK)) != 0)
                  return ret;
          ...
          mptctl_hp_targetinfo($ARG);
    metadata:
      cwe: "CWE-369"
      cve: "CVE-2020-12652"