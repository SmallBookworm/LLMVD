rules:
  - id: pillow-tiff-decoder-buffer-overflow
    patterns:
      - pattern-either:
          - pattern: |
              if (strcasecmp(compname, "tiff_raw_16") == 0) {
                  compression = COMPRESSION_CCITTRLEW;
              } else {
                  PyErr_SetString(PyExc_ValueError, "unknown compession");
                  return NULL;
              }
    message: "Missing compression type checks before calling ImagingLibTiffInit may lead to buffer overflow (CVE-2016-0740)."
    severity: ERROR
    languages: [c]
    metadata:
      cwe: "CWE-119"
      cve: "CVE-2016-0740"