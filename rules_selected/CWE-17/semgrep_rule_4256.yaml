rules:
  - id: cve-2015-1805-pipe-read-vuln
    message: "Detected vulnerable pipe_read implementation using pipe_iov_copy_to_user which may lead to I/O vector array overrun (CVE-2015-1805)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          pipe_iov_copy_to_user($IOV, $ADDR, $CHARS, $ATOMIC)
      - pattern: |
          error = pipe_iov_copy_to_user(...)
    metadata:
      cwe: ["CWE-17"]
      cve: "CVE-2015-1805"