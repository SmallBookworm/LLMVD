rules:
  - id: imagemagick-xwd-memory-leak-cve-2017-11166
    message: "Missing overflow check before allocating memory for colormap in XWD image reader may lead to memory exhaustion (CVE-2017-11166)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          length=(size_t) $HEADER.ncolors;
          colors=(XColor *) AcquireQuantumMemory(length,sizeof(*colors));
      - pattern: |
          length=(size_t) $HEADER->ncolors;
          colors=(XColor *) AcquireQuantumMemory(length,sizeof(*colors));
    metavariable-pattern:
      metavariable: $HEADER
      pattern-either:
        - pattern: header
        - pattern: $ANY
    fixes:
      - regex: (?s)(length=\(size_t\) \$HEADER(\.|->)ncolors;\s*colors=\(XColor \*\) AcquireQuantumMemory\(length,sizeof\(\*colors\)\);)
        replacement: if ($HEADER$1.ncolors > SIZE_MAX / sizeof(XColor)) { return NULL; } $1
    fix-regex:
      enabled: false