rules:
  - id: imagemagick-pcl-memory-leak-cve-2019-12976
    message: "Memory leak in ReadPCLImage due to missing image cleanup when delegate_info is NULL."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              if (delegate_info == (const DelegateInfo *) NULL)
                return((Image *) NULL);
          - pattern: |
              if (delegate_info == (const DelegateInfo *) NULL)
                return NULL;
    metadata:
      cwe: "CWE-401"
      cve: "CVE-2019-12976"