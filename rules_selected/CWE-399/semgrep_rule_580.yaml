rules:
  - id: cve-2012-4467-incorrect-compat-put-timespec-args
    patterns:
      - pattern-either:
          - pattern: compat_put_timespec($USER_PTR, $KERNEL_PTR)
          - pattern: compat_put_timeval($USER_PTR, $KERNEL_PTR)
    message: "Incorrect argument order in compat_put_timespec/compat_put_timeval may lead to information disclosure or denial of service (CVE-2012-4467). Kernel pointer passed as user pointer."
    severity: ERROR
    languages: [c]
    metadata:
      cwe: "CWE-399"
      confidence: HIGH