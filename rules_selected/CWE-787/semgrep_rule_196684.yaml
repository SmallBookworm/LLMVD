rules:
  - id: tensorflow_avgpool3dgrad_buffer_overflow
    patterns:
      - pattern-either:
          - pattern: |
              static void launch(OpKernelContext* context,
                                 const TensorShape& tensor_in_shape,
                                 const Tensor& out_backprop,
                                 ...,
                                 Tensor* output) {
                ...
                output->flat<T>().setZero();
                ...
              }
          - pattern: |
              static void launch(OpKernelContext* context,
                                 const TensorShape& tensor_in_shape,
                                 const Tensor& out_backprop,
                                 ...,
                                 Tensor* output) {
                ...
                std::array<int64, 3> input_size = {{...}};
                ...
              }
    pattern-not: |
      static void launch(OpKernelContext* context,
                         const TensorShape& tensor_in_shape,
                         const Tensor& out_backprop,
                         ...,
                         Tensor* output) {
        OP_REQUIRES(context, tensor_in_shape.dim_size(0) == out_backprop.dim_size(0), ...);
        OP_REQUIRES(context, tensor_in_shape.dim_size(4) == out_backprop.dim_size(4), ...);
        ...
      }
    message: "Missing validation of matching first and last dimensions between tensor_in_shape and out_backprop in AvgPool3DGrad may lead to heap buffer overflow (CWE-787)."
    severity: ERROR
    languages: [c]
    metadata:
      cwe: "CWE-787"
      cve: "CVE-2021-29577"