rules:
  - id: imagemagick-pnm-buffer-overflow-cve-2019-13304
    message: "Stack-based buffer overflow in WritePNMImage due to misplaced assignment in pixel writing loop (CVE-2019-13304)."
    severity: ERROR
    languages: [c]
    pattern-either:
