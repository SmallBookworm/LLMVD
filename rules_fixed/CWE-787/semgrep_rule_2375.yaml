rules:
  - id: hmac_underlying_hash_keyed_check_missing
    message: "HMAC implementation does not validate that the underlying hash algorithm is unkeyed, which may lead to a stack buffer overflow (CWE-787)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          static int hmac_create(...) {
            ...
            struct shash_alg *salg = ...;
            ...
            $ALG = &salg->base;
            ...
            if ($DS > $ALG.cra_blocksize || ...) goto ...;
            ...
          }
      - pattern: |
          static int hmac_create(...) {
            ...
            struct shash_alg *salg = ...;
            ...
            if ($DS > $SALG.digestsize || ...) goto ...;
            ...
          }
    pattern-not: |
      static int hmac_create(...) {
        ...
        struct shash_alg *salg = ...;
        ...
        if (crypto_shash_alg_has_setkey(salg)) goto ...;
        ...
      }