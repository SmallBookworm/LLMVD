rules:
  - id: cwe-362-race-condition-file-handle
    message: "Potential race condition due to double fetch of file_handle from user space. The handle_bytes field may be modified between two copy_from_user calls, leading to memory over-read."
    severity: WARNING
    languages: [c]
    pattern-either:
      - pattern: |
          copy_from_user($f_handle, $ufh, sizeof(struct file_handle));
          ...
          copy_from_user($handle, $ufh, sizeof(struct file_handle) + $f_handle->handle_bytes);
    metadata:
      cwe: "CWE-362"
      cve: "CVE-2015-1420"