rules:
  - id: imagemagick-mpc-memory-leak-cve-2017-5507
    message: "Potential memory leak in ReadMPCImage due to missing AcquireMagickResource checks before PersistPixelCache. This may lead to denial of service via memory exhaustion (CVE-2017-5507, CWE-401)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if (status == MagickFalse)
            ThrowReaderException(CacheError,"UnableToPersistPixelCache");
          ...
          status=PersistPixelCache($IMAGE,$CACHE_FILENAME,MagickTrue,&$OFFSET,$EXCEPTION);
      - pattern: |
          status=PersistPixelCache($IMAGE,$CACHE_FILENAME,MagickTrue,&$OFFSET,$EXCEPTION);
          if (status == MagickFalse)
            ThrowReaderException(CacheError,"UnableToPersistPixelCache");
    metavariable-pattern:
      metavariable: $IMAGE
      pattern: image