rules:
  - id: jpeg2000_non_zero_image_offsets
    message: "Non-zero image offsets (image_offset_x or image_offset_y) are not supported and can lead to out-of-bounds array access (CWE-119)."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              if (s->image_offset_x || s->image_offset_y) {
                  ...
              }
          - pattern: |
              s->avctx->width = ff_jpeg2000_ceildivpow2(s->width - s->image_offset_x, ...);
              s->avctx->height = ff_jpeg2000_ceildivpow2(s->height - s->image_offset_y, ...);
      - metavariable-pattern:
          metavariable: $s
          pattern: Jpeg2000DecoderContext
      - pattern-not: |
          if (s->image_offset_x || s->image_offset_y) {
              avpriv_request_sample(...);
              return AVERROR_PATCHWELCOME;
          }