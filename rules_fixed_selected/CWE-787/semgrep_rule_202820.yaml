rules:
  - id: gdal-kml-missing-axis-mapping-strategy
    message: "Missing call to SetAxisMappingStrategy(OAMS_TRADITIONAL_GIS_ORDER) on OGRSpatialReference may lead to incorrect coordinate handling in KML layers."
    severity: WARNING
    languages: [c]
    pattern: |
      poSRS_->SetWellKnownGeogCS("WGS84");
      if (!poSRS_->IsSame(...)) { ... }
    pattern-not: |
      poSRS_->SetWellKnownGeogCS("WGS84");
      poSRS_->SetAxisMappingStrategy(OAMS_TRADITIONAL_GIS_ORDER);
      if (!poSRS_->IsSame(...)) { ... }