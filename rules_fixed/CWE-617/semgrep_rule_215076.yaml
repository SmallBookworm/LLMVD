rules:
  - id: cwe-617-assert-channel-check
    message: "Assertion used to validate number of channels; may cause denial of service on invalid input. Use runtime validation instead."
    severity: ERROR
    languages: [c]
    pattern: |
      assert($NUM_CHANNELS > 0);
    metadata:
      cwe: "CWE-617"
      cve: "CVE-2018-14044"