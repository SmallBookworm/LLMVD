rules:
  - id: cve-2017-13028-buffer-overread-bootp
    message: "Missing bounds check on bp->bp_flags before access may lead to buffer over-read (CWE-125)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - patterns:
        - pattern: ND_PRINT((..., ", Flags [%s]", ... EXTRACT_16BITS(&bp->bp_flags) ...));
        - pattern: if (... ndo->ndo_vflag > 1 ...) ND_PRINT((..., " (0x%04x)", EXTRACT_16BITS(&bp->bp_flags)));
        - metavariable-regex:
            metavariable: bp
            regex: '^[a-zA-Z_][a-zA-Z0-9_]*$'
        - focus-metavariable: bp
        - metavariable-pattern:
            metavariable: bp
            pattern: (const struct bootp *)
        - pattern-not: |
            ND_TCHECK(bp->bp_flags);
            ...
            ND_PRINT((..., ", Flags [%s]", ... EXTRACT_16BITS(&bp->bp_flags) ...));
      - patterns:
        - pattern: if (... ndo->ndo_vflag > 1 ...) ND_PRINT((..., " (0x%04x)", EXTRACT_16BITS(&bp->bp_flags)));
        - pattern: ND_PRINT((..., ", Flags [%s]", ... EXTRACT_16BITS(&bp->bp_flags) ...));
        - metavariable-regex:
            metavariable: bp
            regex: '^[a-zA-Z_][a-zA-Z0-9_]*$'
        - focus-metavariable: bp
        - metavariable-pattern:
            metavariable: bp
            pattern: (const struct bootp *)
        - pattern-not: |
            ND_TCHECK(bp->bp_flags);
            ...
            ND_PRINT((..., ", Flags [%s]", ... EXTRACT_16BITS(&bp->bp_flags) ...));