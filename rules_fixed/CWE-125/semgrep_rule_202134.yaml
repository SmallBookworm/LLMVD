rules:
  - id: cwe-125-bson-utf8-validate-length
    message: "Potential heap-based buffer over-read due to missing validation of string length before subtraction. This may lead to a denial of service (CWE-125)."
    severity: ERROR
    languages: [c]
    pattern: |
      memcpy (&len, ..., sizeof (len));
      *length = BSON_UINT32_FROM_LE (len) - 1;
    metadata:
      cwe: ["CWE-125"]
      cve: "CVE-2017-14227"