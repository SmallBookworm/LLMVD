rules:
  - id: cve-2011-3114-buffer-overflow-pdf
    message: Potential buffer overflow due to unsafe bounds handling in PDF-related UI code.
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              if (frame()->widget_delegate() &&
                  frame()->widget_delegate()->ShouldShowWindowTitle()) {
                return close_button_->bounds().bottom();
              }
          - pattern: |
              if (!frame()->IsMaximized() || ...)
                return kTabstripTopSpacingRestored;
    metadata:
      cwe: ["CWE-119"]
      cve: "CVE-2011-3114"