rules:
  - id: stbi_jpeg_fractional_subsampling
    message: "Fractional JPEG component subsampling ratios can lead to buffer overflow (CVE-2021-28021, CWE-787)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          for (...; ...; ...) {
            ...
            if (!z->img_comp[...].h || z->img_comp[...].h > 4) ...
            if (!z->img_comp[...].v || z->img_comp[...].v > 4) ...
            ...
          }
          ...
          for (...; ...; ...) {
            if (z->img_comp[...].h > h_max) ...
            if (z->img_comp[...].v > v_max) ...
          }
          ...
          // missing validation: h_max % z->img_comp[i].h != 0 or v_max % z->img_comp[i].v != 0
      - pattern-not-inside: |
          for (...; ...; ...) {
            if (h_max % z->img_comp[...].h != 0) ...
            if (v_max % z->img_comp[...].v != 0) ...
          }
    metavariable-regex:
      metavariable: $...
      regex: ".*"