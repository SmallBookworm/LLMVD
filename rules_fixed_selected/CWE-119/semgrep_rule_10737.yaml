rules:
  - id: vmxnet_ip_header_length_check_missing
    message: Missing check for minimum IPv4 header length may lead to buffer over-read (CVE-2016-6835).
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              l3_hdr->iov_len = IP_HDR_GET_LEN(...);
              pkt->l4proto = ...;
          - pattern: |
              l3_hdr->iov_len = IP_HDR_GET_LEN(...);
              /* copy optional IPv4 header data */