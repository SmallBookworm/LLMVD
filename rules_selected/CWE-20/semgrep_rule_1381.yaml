rules:
  - id: cve-2013-7270-uninitialized-msg_namelen
    message: "msg_namelen is set before checking if msg->msg_name is valid, potentially leaking uninitialized kernel memory."
    severity: WARNING
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              msg->msg_namelen = ...;
              ...
              if (msg->msg_name)
                memcpy(msg->msg_name, ..., msg->msg_namelen);
          - pattern: |
              if (sock->type == ...)
                msg->msg_namelen = ...;
              else
                msg->msg_namelen = ...;
              ...
              if (msg->msg_name)
                memcpy(msg->msg_name, ..., msg->msg_namelen);
    metadata:
      cwe: "CWE-20"
      cve: "CVE-2013-7270"