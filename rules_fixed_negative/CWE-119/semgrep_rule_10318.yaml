rules:
  - id: cve-2016-9103-uninitialized-xattr-memory
    message: "Use of g_malloc() without initialization may leak host heap memory to guest. Use g_malloc0() instead."
    severity: WARNING
    languages: [c]
    patterns:
      - pattern: |
          $XATTR_FIDP->fs.xattr.value = g_malloc($SIZE);
    metadata:
      cwe: "CWE-119"
      cve: "CVE-2016-9103"