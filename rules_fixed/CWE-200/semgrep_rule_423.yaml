rules:
  - id: ghostscript_safer_bypass_libfile
    message: "Potential SAFER mode bypass in Ghostscript due to missing reset of starting_arg_file flag, which may allow arbitrary file reads via .libfile operator."
    severity: WARNING
    languages: [c]
    cwe: ["CWE-200"]
    pattern: |
      if (iodev == 0) {
          iodev = (gx_io_device *)gx_io_device_table[0];
          search_with_combine = false;
      } else {
          search_with_no_combine = starting_arg_file;
          search_with_combine = true;
      }
    pattern-not: |
      if (i_ctx_p && starting_arg_file) {
          i_ctx_p->starting_arg_file = false;
      }