rules:
  - id: cve-2018-18585-null-byte-filename
    message: "CHM file entry with null byte in first or second character of filename may lead to NULL pointer dereference (CWE-476)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if (name_len == 0) ...
      - pattern: |
          if ((offset == 0) && (length == 0)) {
            if ((name_len > 0) && (name[name_len-1] == '/')) ...
          }
    metavariable-pattern:
      metavariable: name
      patterns:
        - pattern: $NAME
          metavariable: name
    fix-regex:
      enabled: false