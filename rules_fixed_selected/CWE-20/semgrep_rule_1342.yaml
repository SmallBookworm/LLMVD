rules:
  - id: cve-2014-0077-vhost-net-rx-validation
    message: "Missing validation for headcount overrun in handle_rx may lead to memory corruption (CVE-2014-0077, CWE-20)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          headcount = get_rx_bufs(...);
          if (unlikely(headcount < 0))
            ...
          if (!headcount) {
            ...
          }
      - pattern: |
          headcount = get_rx_bufs(...);
          if (unlikely(headcount < 0))
            ...
          /* OK, now we need to know about added descriptors. */
          if (!headcount) {
            ...
          }
    metavariable-pattern:
      metavariable: headcount
      pattern: $HEADCOUNT
    pattern-not-inside: |
      headcount = get_rx_bufs(...);
      if (unlikely(headcount < 0))
        ...
      if (unlikely(headcount > UIO_MAXIOV)) {
        ...
      }
      if (!headcount) {
        ...
      }