rules:
  - id: phpinfo-type-confusion-info-leak
    message: "Potential type confusion vulnerability in phpinfo() leading to information disclosure. Ensure variables PHP_AUTH_PW, PHP_AUTH_TYPE, PHP_AUTH_USER, and PHP_SELF are of string type before use."
    severity: WARNING
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              if (zend_hash_find(&EG(symbol_table), "PHP_SELF", sizeof("PHP_SELF"), (void **) &data) != FAILURE) {
                  php_info_print_table_row(2, "PHP_SELF", Z_STRVAL_PP(data));
              }
          - pattern: |
              if (zend_hash_find(&EG(symbol_table), "PHP_AUTH_TYPE", sizeof("PHP_AUTH_TYPE"), (void **) &data) != FAILURE) {
                  php_info_print_table_row(2, "PHP_AUTH_TYPE", Z_STRVAL_PP(data));
              }
          - pattern: |
              if (zend_hash_find(&EG(symbol_table), "PHP_AUTH_USER", sizeof("PHP_AUTH_USER"), (void **) &data) != FAILURE) {
                  php_info_print_table_row(2, "PHP_AUTH_USER", Z_STRVAL_PP(data));
              }
          - pattern: |
              if (zend_hash_find(&EG(symbol_table), "PHP_AUTH_PW", sizeof("PHP_AUTH_PW"), (void **) &data) != FAILURE) {
                  php_info_print_table_row(2, "PHP_AUTH_PW", Z_STRVAL_PP(data));
              }
    metadata:
      cwe: "CWE-200"
      cve: "CVE-2014-4721"