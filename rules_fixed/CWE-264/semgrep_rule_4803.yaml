rules:
  - id: missing_windows_media_player_plugin_check
    message: "Missing check for Windows Media Player plugin group, which may allow unauthorized plugin usage without user interaction."
    severity: WARNING
    languages: [c]
    pattern-either:
      - pattern: |
          if (name == webkit::npapi::PluginGroup::kJavaGroupName)
            ...
          else if (name == webkit::npapi::PluginGroup::kQuickTimeGroupName)
            ...
          else if (name == webkit::npapi::PluginGroup::kShockwaveGroupName)
            ...
          else if (name == webkit::npapi::PluginGroup::kRealPlayerGroupName)
            ...
      - pattern: |
          if (name == webkit::npapi::PluginGroup::kJavaGroupName)
            ...
          else if (name == webkit::npapi::PluginGroup::kQuickTimeGroupName)
            ...
          else if (name == webkit::npapi::PluginGroup::kShockwaveGroupName)
            ...
          else if (name == webkit::npapi::PluginGroup::kRealPlayerGroupName)
            ...
          else if (...)
            ...
    metavariable-pattern:
      metavariable: $BODY
      pattern-not: |
        ... || name == webkit::npapi::PluginGroup::kWindowsMediaPlayerGroupName ...