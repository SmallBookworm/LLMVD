rules:
  - id: mwifiex_pcie_init_evt_ring_memory_leak
    patterns:
      - pattern-either:
          - pattern: |
              if (mwifiex_map_pci_memory(...)) {
                  return -1;
              }
          - pattern: |
              if (mwifiex_map_pci_memory(...))
