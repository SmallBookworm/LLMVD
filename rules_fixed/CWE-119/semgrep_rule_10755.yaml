rules:
  - id: vqa_image_size_not_multiple_of_block_size
    message: "Image dimensions are not validated to be multiples of block size, leading to potential heap-based buffer overflow (CVE-2012-0947)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if ((...->vector_width != 4)
              || ((...->vector_height != 2) && (...->vector_height != 4))) {
              ...
              return ...;
          }
          ...
          ...->decode_buffer_size = (...->width / ...->vector_width)
              * (...->height / ...->vector_height) * ...;
      - pattern: |
          if ((...->vector_width != 4)
              || ((...->vector_height != 2) && (...->vector_height != 4)))
              return ...;
          ...
          ...->decode_buffer_size = (...->width / ...->vector_width)
              * (...->height / ...->vector_height) * ...;
    metavariable-pattern:
      metavariable: $ctx
      pattern: $ctx