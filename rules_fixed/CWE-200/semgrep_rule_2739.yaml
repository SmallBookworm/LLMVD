rules:
  - id: ffmpeg-cve-2017-9993-gab2-sub-demuxer-validation
    message: "Missing validation of sub_demuxer name in GAB2 subtitle handling may lead to arbitrary file read (CVE-2017-9993, CWE-200)."
    severity: WARNING
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              if (!sub_demuxer)
                  goto error;
              ...
              if (!(ast->sub_ctx = avformat_alloc_context()))
          - pattern: |
              if (!sub_demuxer)
                  goto error;
              ...
              ast->sub_ctx->pb = pb;
      - metavariable-pattern:
          metavariable: ast
          pattern: $AST
      - pattern-not: |
          if (!sub_demuxer)
              goto error;
          ...
          if (strcmp(sub_demuxer->name, "srt") && strcmp(sub_demuxer->name, "ass"))
              goto error;