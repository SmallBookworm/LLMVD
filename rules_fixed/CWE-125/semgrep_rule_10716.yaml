rules:
  - id: cve-2017-14976-buffer-overread
    message: "Potential heap-based buffer over-read in FoFiType1C::convertToType0 due to missing bounds check on 'fd' before accessing 'privateDicts[fd]'."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern: |
          if (fdSelect) {
            ...
            fd = fdSelect[...];
            ...
          }
          ...
          privateDicts[fd]...
      - pattern-not: |
          if (fdSelect) {
            ...
            fd = fdSelect[...];
            ...
          }
          ...
          if (fd >= nFDs)
            continue;
          ...
          privateDicts[fd]...