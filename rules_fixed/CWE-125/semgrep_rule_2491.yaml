rules:
  - id: cve-2017-13725-ipv6-rt6-buffer-overread
    message: "Buffer over-read vulnerability in IPv6 routing header parser. The length field is accessed before ensuring sufficient data is available."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - patterns:
              - pattern: |
                  $DP = (const struct ip6_rthdr *)$BP;
              - pattern: |
                  $LEN = $DP->ip6r_len;
              - pattern: |
                  $EP = $NDO->ndo_snapend;
          - patterns:
              - pattern: |
                  $DP = (const struct ip6_rthdr *)$BP;
              - pattern: |
                  $LEN = $DP->ip6r_len;
              - pattern: |
                  ND_TCHECK($DP->ip6r_segleft);
    metadata:
      cwe: "CWE-125"
      cve: "CVE-2017-13725"