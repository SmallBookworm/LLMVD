rules:
  - id: cve-2017-15306-null-deref-kvm-check-extension
    message: "NULL pointer dereference in kvm_vm_ioctl_check_extension when handling KVM_CAP_PPC_HTM without checking if 'kvm' is NULL. This can lead to a denial of service (CVE-2017-15306)."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              case KVM_CAP_PPC_HTM:
                ... is_kvmppc_hv_enabled(kvm) ...
          - pattern: |
              r = ... is_kvmppc_hv_enabled(kvm);
    metadata:
      cwe: "CWE-476"
      cve: "CVE-2017-15306"