rules:
  - id: cve-2013-6432-null-pointer-dereference
    message: "Potential NULL pointer dereference when accessing msg->msg_name without checking for NULL. This can lead to a denial of service (CVE-2013-6432)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          struct sockaddr_in *sin = (struct sockaddr_in *)msg->msg_name;
          sin->...
      - pattern: |
          struct sockaddr_in6 *sin6 = (struct sockaddr_in6 *)msg->msg_name;
          sin6->...
    metavariable-pattern:
      metavariable: msg
      pattern: msg