rules:
  - id: cve-2019-15221-null-check-missing
    message: Missing check for zero max_packet_size from usb_maxpacket(), which may lead to NULL pointer dereference or buffer overflow.
    severity: ERROR
    languages: [c]
    pattern-either:
      - patterns:
          - pattern: |
              $OBJ->max_packet_size_in = usb_maxpacket(...);
              $OBJ->max_packet_size_out = usb_maxpacket(...);
              if (!...)
                {...}
          - pattern-not: |
              if (!$OBJ->max_packet_size_in || !$OBJ->max_packet_size_out)
                {...}
      - patterns:
          - pattern: |
              $OBJ->max_packet_size_in = usb_maxpacket(...);
              $OBJ->max_packet_size_out = usb_maxpacket(...);
              ...
              line6_create_audio_out_urbs($OBJ);
          - pattern-not: |
              if (!$OBJ->max_packet_size_in || !$OBJ->max_packet_size_out)
                {...}
      - patterns:
          - pattern: |
              $OBJ->max_packet_size_in = usb_maxpacket(...);
              $OBJ->max_packet_size_out = usb_maxpacket(...);
              ...
              line6_create_audio_in_urbs($OBJ);
          - pattern-not: |
              if (!$OBJ->max_packet_size_in || !$OBJ->max_packet_size_out)
                {...}