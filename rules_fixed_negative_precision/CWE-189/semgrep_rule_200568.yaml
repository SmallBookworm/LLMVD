rules:
  - id: cve-2013-4564-ike-short-packet
    message: "Processing of short IKE packets without proper validation may lead to denial of service (CVE-2013-4564)."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              if (!in_struct(...)) {
                  ...
                  if ($PBS.roof - $PBS.cur >= (ptrdiff_t)$DESC.size) {
                      ...
                      $HDR = (struct isakmp_hdr *)$PBS.cur;
                      ...
                  } else {
                      ...
                  }
              }
          - pattern: |
              if (!in_struct(...)) {
                  ...
                  if ($LEN >= $SIZE) {
                      ...
                  } else {
                      ...
                  }
              }
    metavariable-patterns:
      - metavariable: $PBS
        pattern: md->packet_pbs
      - metavariable: $DESC
        pattern: isakmp_hdr_desc