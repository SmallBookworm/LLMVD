rules:
  - id: cve-2013-4353-null-deref-ssl3-take-mac
    message: "Missing null check for s->s3->tmp.new_cipher before use in ssl3_take_mac may lead to NULL pointer dereference (CVE-2013-4353)."
    severity: ERROR
    languages: [c]
    pattern: |
      if (s->state & SSL_ST_CONNECT)
        {
          ...
        }
      s->s3->tmp.peer_finish_md_len = s->method->ssl3_enc->final_finish_mac(...);
    pattern-not: |
      if (s->s3->tmp.new_cipher == NULL)
        return;
      if (s->state & SSL_ST_CONNECT)
        {
          ...
        }
      s->s3->tmp.peer_finish_md_len = s->method->ssl3_enc->final_finish_mac(...);