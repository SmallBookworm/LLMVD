rules:
  - id: cve-2020-8265-use-after-free-tls
    message: Potential use-after-free vulnerability in TLS implementation due to missing ownership retention of WriteWrap object (CVE-2020-8265).
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          WriteWrap* $REQ_WRAP = CreateWriteWrap($REQ_WRAP_OBJ);
          ...
          return StreamWriteResult { ..., $REQ_WRAP, ... };
      - pattern: |
          WriteWrap* $REQ_WRAP = CreateWriteWrap($REQ_WRAP_OBJ);
          ...
          return StreamWriteResult { ..., $REQ_WRAP, ..., ... };
    metavariable-regex:
      metavariable: $REQ_WRAP
      regex: req_wrap