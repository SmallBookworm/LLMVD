rules:
  - id: cve-2020-7071-url-parsing-userinfo-validation
    message: Missing userinfo validation in URL parsing may lead to incorrect host extraction (CVE-2020-7071).
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if ((p = zend_memrchr(s, '@', (e-s)))) {
            if ((pp = memchr(s, ':', (p-s)))) {
              ...
            } else {
              ret->user = estrndup(s, (p-s));
              ...
            }
            s = p + 1;
          }
      - pattern: |
          if ((p = zend_memrchr(s, '@', (e-s)))) {
            ...
            else {
              ret->user = estrndup(s, (p-s));
              ...
            }
            s = p + 1;
          }
    metavariable-pattern:
      metavariable: $...
      pattern: '!'
    pattern-not: |
      if (!is_userinfo_valid(...)) {
        goto check_port;
      }