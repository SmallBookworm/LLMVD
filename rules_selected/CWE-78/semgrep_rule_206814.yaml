rules:
  - id: cwe-78-os-command-injection-podcast-filename
    patterns:
      - pattern-either:
          - pattern: |
              $CMDLINE.append(" \"");
              $CMDLINE.append(utils::replace_all($FILE, "\"", "\\\""));
              $CMDLINE.append("\"");
          - pattern: |
              $CMDLINE += " \"";
              $CMDLINE += utils::replace_all($FILE, "\"", "\\\"");
              $CMDLINE += "\"";
    message: "Potential OS command injection via unescaped shell metacharacters in podcast filename. Use single quotes and proper escaping to mitigate."
    severity: WARNING
    languages: [c]
    metadata:
      cwe: "CWE-78"
      cve: "CVE-2017-14500"