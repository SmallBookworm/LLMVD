rules:
  - id: tensorflow-savev2-validation-bypass
    patterns:
      - pattern-either:
          - patterns:
              - pattern: ValidateInputs(..., $CONTEXT, ...);
              - pattern-inside: |
                  ValidateInputs(..., $CONTEXT, ...);
                  ...
                  $CONTEXT->status()
          - patterns:
              - pattern: ValidateInputs(..., $CONTEXT, ...);
              - pattern-inside: |
                  ValidateInputs(..., $CONTEXT, ...);
                  ...
                  OP_REQUIRES_OK($CONTEXT, ...)
    message: "Missing check for context status after ValidateInputs may lead to null pointer dereference (CVE-2021-37648)."
    severity: ERROR
    languages: [c]
    metadata:
      cwe: "CWE-369"
      references:
        - https://github.com/tensorflow/tensorflow/commit/9728c60e136912a12d99ca56e106b7cce7af5986
        - https://nvd.nist.gov/vuln/detail/CVE-2021-37648