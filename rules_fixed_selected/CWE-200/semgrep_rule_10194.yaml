rules:
  - id: cve-2017-0817-buffer-size-check-missing
    message: Missing buffer size validation may lead to information disclosure (CVE-2017-0817, CWE-200).
    severity: WARNING
    languages: [c]
    pattern-either:
      - pattern: |
          *header = new OMX_BUFFERHEADERTYPE;
          ...
          (*header)->nAllocLen = $SIZE;
          ...
          PortInfo *$PORT = &$MPORTS.editItemAt($PORTINDEX);
      - pattern: |
          PortInfo *$PORT = &$MPORTS.editItemAt($PORTINDEX);
          ...
          *header = new OMX_BUFFERHEADERTYPE;
          ...
          (*header)->nAllocLen = $SIZE;
    metavariable-pattern:
      $SIZE: { pattern: "size" }
    pattern-not: |
      if ($SIZE < $PORT->mDef.nBufferSize) {
        ...
        return OMX_ErrorBadParameter;
      }