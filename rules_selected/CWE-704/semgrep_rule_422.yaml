rules:
  - id: cve-2016-8602-stack-underflow
    message: "Potential stack underflow in .sethalftone5 due to missing operand stack check before accessing op and op-1."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          os_ptr op = osp;
          ...
          int dict_enum = dict_first(op);
          ...
          int space_index = r_space_index(op - 1);
      - pattern: |
          os_ptr op = osp;
          ...
          dict_enum = dict_first(op);
          ...
          space_index = r_space_index(op - 1);
    metavariable-pattern:
      metavariable: op
      pattern: "osp"