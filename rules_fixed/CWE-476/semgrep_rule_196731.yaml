rules:
  - id: cve-2021-32438-null-pointer-dereference
    message: "Potential NULL pointer dereference due to missing null check on 'esd->decoderConfig'."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern: |
          if ($ESD) {
            ...
            if ($ESD->decoderConfig->...)
          }
    metavariable-pattern:
      $ESD:
        pattern-either:
          - pattern: esd