rules:
  - id: cve-2017-7500-rpm-symlink-verification
    message: "Symbolic link to directory is followed without verifying ownership, which may lead to privilege escalation (CVE-2017-7500, CWE-59)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if (S_ISDIR($FMODE) && S_ISLNK($SB.st_mode) && stat($FN, &$SB) != 0) {
            ...
          }
      - pattern: |
          if (S_ISDIR($FMODE) && S_ISLNK($SB.st_mode))
            if (stat($FN, &$DSB) == 0 && S_ISDIR($DSB.st_mode)) {
              $SB = $DSB;
            }