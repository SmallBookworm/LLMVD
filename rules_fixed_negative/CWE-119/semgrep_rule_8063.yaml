rules:
  - id: cve-2016-3881-buffer-overread
    message: "Potential buffer over-read due to insufficient data size check before bitstream parsing (CVE-2016-3881, CWE-119)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if (data_sz <= 8)
            return VPX_CODEC_UNSUP_BITSTREAM;
      - pattern: |
          if ((profile >= 2 && data_sz <= 1) || data_sz < 1)
            return VPX_CODEC_UNSUP_BITSTREAM;