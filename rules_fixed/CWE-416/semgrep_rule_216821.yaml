rules:
  - id: cve-2020-8265-use-after-free-tls
    message: "Detected vulnerable DoWrite function signature using raw WriteWrap pointer, which may lead to use-after-free (CWE-416). Upgrade to fixed version using std::unique_ptr."
    severity: ERROR
    languages: [c]
    pattern: |
      int LibuvStreamWrap::DoWrite(WriteWrap* req_wrap);