rules:
  - id: cve-2019-13114-null-ptr-deref
    message: "Potential NULL pointer dereference due to unchecked strchr return value. This can lead to denial of service (CVE-2019-13114)."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: atoi(strchr(...))
          - pattern: status = atoi(strchr(...))
          - pattern: result = atoi(strchr(...))
    metadata:
      cwe: "CWE-476"