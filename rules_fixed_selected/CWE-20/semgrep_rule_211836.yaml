rules:
  - id: gnutls_cve_2013_2116
    message: "Missing padding length validation may lead to buffer over-read (CVE-2013-2116, CWE-20)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          pad = ciphertext.data[ciphertext.size - 1];
          ...
          if (_gnutls_version_has_variable_padding(...))
            ...
      - pattern: |
          pad = ciphertext.data[ciphertext.size - 1];
          ...
          for (i = 2; i <= pad; i++)
            ...
    pattern-not: |
      pad = ciphertext.data[ciphertext.size - 1];
      ...
      if (pad+1 > ciphertext.size-hash_size)
        pad_failed = GNUTLS_E_DECRYPTION_FAILED;
      ...