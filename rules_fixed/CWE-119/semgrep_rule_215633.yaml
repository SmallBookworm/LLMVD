rules:
  - id: virtio-blk-unaligned-request
    message: "Unaligned I/O request may lead to heap-based buffer overflow (CVE-2011-1750). Missing check for logical block size alignment."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - patterns:
            - pattern: |
                if (sector & $MASK) {
                    virtio_blk_rw_complete($REQ, -EIO);
                    return;
                }
            - pattern: $REQ->qiov.size / ...
          - patterns:
            - pattern: |
                if (sector & $MASK) {
                    virtio_blk_rw_complete($REQ, -EIO);
                    return;
                }
            - pattern: if ($COND) { ... }
            - pattern: $REQ->qiov.size / ...
      - pattern-not: |
          if (sector & $MASK) {
              virtio_blk_rw_complete($REQ, -EIO);
              return;
          }
          if ($REQ->qiov.size % $BLOCK_SIZE) {
              virtio_blk_rw_complete($REQ, -EIO);
              return;
          }
    metavariable-regex:
      metavariable: $BLOCK_SIZE
      regex: "req->dev->conf->logical_block_size"