rules:
  - id: hsr_dev_finalize_memory_leak
    message: "Memory leak in hsr_dev_finalize(): if hsr_add_port() fails, self node is not freed."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          res = hsr_add_port(..., HSR_PT_MASTER);
          if (res)
            return res;
      - pattern: |
          res = hsr_add_port(..., HSR_PT_MASTER);
          if (res)
            return ...;