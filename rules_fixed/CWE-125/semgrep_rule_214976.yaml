rules:
  - id: cve-2019-15927-out-of-bounds-access
    message: "Out-of-bounds access due to reading bNrInPins before bLength validation in build_audio_procunit"
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          struct uac_processing_unit_descriptor *desc = ...;
          int num_ins = desc->bNrInPins;
          ...;
          if (desc->bLength < 13 || ...)
      - pattern: |
          struct uac_processing_unit_descriptor *desc = ...;
          ...;
          int num_ins = desc->bNrInPins;
          ...;
          if (desc->bLength < 13 || ...)
    metadata:
      cwe: "CWE-125"
      cve: "CVE-2019-15927"