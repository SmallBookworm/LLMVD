rules:
  - id: tensorflow-unsortedsegmentjoin-num-segments-scalar-check
    message: "Missing validation that 'num_segments' is a scalar before accessing it as such. This can lead to a CHECK-failure and denial of service (CVE-2022-29197)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          const Tensor& num_segments_tensor = context->input(2);
          OP_REQUIRES(context, num_segments_tensor.NumElements() == 1, ...);
          auto num_segments = num_segments_tensor.scalar<...>()();
      - pattern: |
          const Tensor& num_segments_tensor = context->input(2);
          OP_REQUIRES(context, num_segments_tensor.NumElements() == 1, ...);
          ...;
          auto num_segments = num_segments_tensor.scalar<...>()();
    pattern-not: |
      OP_REQUIRES(context, TensorShapeUtils::IsScalar(num_segments_tensor.shape()), ...);