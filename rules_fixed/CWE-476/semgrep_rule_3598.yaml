rules:
  - id: unchecked_null_pointer_in_expr_resolve_lhs
    message: "Unchecked NULL pointer dereference possible in ExprResolveLhs due to missing validation of xkb_atom_text return values."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          case EXPR_FIELD_REF:
              ...
              return true;
      - pattern: |
          case EXPR_ARRAY_REF:
              ...
              return true;
    metavariable-pattern:
      metavariable: $BODY
      patterns:
        - pattern-either:
            - pattern: |
                *elem_rtrn = xkb_atom_text(..., ...);
                *field_rtrn = xkb_atom_text(..., ...);
                ...
                return true;
            - pattern: |
                *elem_rtrn = xkb_atom_text(..., ...);
                *field_rtrn = xkb_atom_text(..., ...);
                ...
                if (...) return false;
                ...
                return true;