rules:
  - id: cwe-787-ffmpeg-cbs-jpeg-sos-length-check
    message: "Missing length check before memcpy in JPEG_MARKER_SOS handling may lead to heap-based buffer overflow (CWE-787)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if (marker == JPEG_MARKER_SOS) {
              ...
              length = AV_RB16(frag->data + start);
              ...
              memcpy(data, frag->data + start, length);
              ...
          }
      - pattern: |
          if (marker == JPEG_MARKER_SOS) {
              ...
              length = AV_RB16(...);
              ...
              memcpy(..., ..., length);
              ...
          }
    pattern-not: |
      if (marker == JPEG_MARKER_SOS) {
          ...
          length = AV_RB16(...);
          if (length > ...) return ...;
          ...
          memcpy(..., ..., length);
          ...
      }