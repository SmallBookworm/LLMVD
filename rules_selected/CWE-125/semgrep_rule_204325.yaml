rules:
  - id: cve-2017-9847-bdecode-buffer-overread
    message: "Potential heap-based buffer over-read in bdecode due to missing bounds check before calling parse_int. This may lead to denial of service (CWE-125)."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              if (!numeric($T))
                  TORRENT_FAIL_BDECODE(...);
              ...
              boost::int64_t $LEN = $T - '0';
              char const* $STR_START = $START;
              ++$START;
              bdecode_errors::error_code_enum $E = bdecode_errors::no_error;
              $START = parse_int($START, $END, ':', $LEN, $E);
          - pattern: |
              if (!numeric($T))
                  TORRENT_FAIL_BDECODE(...);
              ...
              boost::int64_t $LEN = $T - '0';
              char const* $STR_START = $START;
              ++$START;
              $START = parse_int($START, $END, ':', $LEN, ...);
    metavariable-regex:
      metavariable: $T
      regex: 't'