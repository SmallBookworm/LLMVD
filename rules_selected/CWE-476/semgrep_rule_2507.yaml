rules:
  - id: cve-2017-13686-null-fi-check
    message: "Missing NULL check for 'res.fi' when RTM_F_FIB_MATCH is set, which may lead to NULL pointer dereference (CWE-476)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if (rtm->rtm_flags & RTM_F_FIB_MATCH)
            ... fib_dump_info(..., res.fi, ...);
      - pattern: |
          if (rtm->rtm_flags & RTM_F_FIB_MATCH)
            fib_dump_info(..., res.fi, ...);
    metadata:
      cwe: ["CWE-476"]
      cve: "CVE-2017-13686"