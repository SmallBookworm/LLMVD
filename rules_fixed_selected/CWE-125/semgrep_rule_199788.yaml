rules:
  - id: exim-spa-oob-read-cve-2020-12783
    message: "Potential out-of-bounds read in SPA authenticator due to missing bounds check on offset before pointer arithmetic."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              if (s + 24 >= US (responseptr+1))
                {
                ...
                return FAIL;
                }
          - pattern: |
              if (p + len*2 >= CS (responseptr+1))
                {
                ...
                return FAIL;
                }
      - pattern-not: |
          if (off >= sizeof(SPAAuthResponse) - 24)
            {
            ...
            return FAIL;
            }
      - pattern-not: |
          if (  (off = IVAL(&responseptr->uUser.offset,0)) >= sizeof(SPAAuthResponse)
             || len >= sizeof(responseptr->buffer)/2
             || (p = (CS responseptr) + off) + len*2 >= CS (responseptr+1)
             )
            {
            ...
            return FAIL;
            }
    metavariable-regex:
      metavariable: $func
      regex: auth_spa_server