rules:
  - id: cve-2012-2823-use-after-free-svg
    message: "Potential use-after-free vulnerability due to enabling threaded compositing in SVG handling (CVE-2012-2823)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: $COMMAND_LINE->AppendSwitch(switches::kEnableThreadedCompositing);
      - pattern: AppendSwitch($COMMAND_LINE, switches::kEnableThreadedCompositing);