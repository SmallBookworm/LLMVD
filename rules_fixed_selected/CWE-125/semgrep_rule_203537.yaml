rules:
  - id: cwe-125-out-of-bounds-read-in-ast_for_arguments
    message: "Out-of-bounds read vulnerability in ast_for_arguments due to missing bounds check before accessing CHILD(n, i)."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              if (i < NCH(n) && TYPE(CHILD(n, i)) == COMMA)
                  i += 1;
          - pattern: |
              if (TYPE(CHILD(n, i)) == COMMA)
                  i += 1;