rules:
  - id: cve-2015-8608-out-of-bounds-read
    message: "Potential out-of-bounds read in MapPathA/MapPathW due to missing length checks before accessing pInName[1] or pInName[2]."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              if (pInName[1] == ':') { ... }
          - pattern: |
              if (IsPathSep(pInName[1]) && IsPathSep(pInName[0])) { ... }
    metavariable-pattern:
      metavariable: pInName
      pattern-not: |
        if (length > 1 && pInName[1] == ':') { ... }