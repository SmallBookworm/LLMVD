rules:
  - id: cve-2021-0561-out-of-bounds-write
    message: Missing check for end-of-stream in verify mode may lead to out-of-bounds write (CWE-787).
    severity: HIGH
    languages: [c]
    pattern-either:
      - pattern: |
          if (!FLAC__stream_decoder_process_single($DECODER)) {
            ...
          }
      - pattern: |
          if (!FLAC__stream_decoder_process_single($DECODER) || ...)
    pattern-not: |
      if (!FLAC__stream_decoder_process_single($DECODER)
          || (!is_last_block
              && (FLAC__stream_encoder_get_verify_decoder_state($...) == FLAC__STREAM_DECODER_END_OF_STREAM))) {
        ...
      }
    metadata:
      cwe: ["CWE-787"]
      cve: "CVE-2021-0561"