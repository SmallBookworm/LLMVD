rules:
  - id: cve-2011-0904-out-of-bounds-access
    message: |
      Missing bounds check on framebuffer update rectangle dimensions may lead to out-of-bounds memory access.
      Ensure that (x + w) <= screen width and (y + h) <= screen height before processing raw encoding.
    severity: ERROR
    languages: [c]
    pattern: |
      if (!rfbSendRectEncodingRaw(cl, x, y, w, h))
          goto tx_error;
    pattern-not: |
      if (w + x > cl->screen->width || h + y > cl->screen->height)
          goto tx_error;
      if (!rfbSendRectEncodingRaw(cl, x, y, w, h))
          goto tx_error;
    fix-regex:
      regex: ''
      replacement: ''