rules:
  - id: qemu-sdhci-block-size-oob
    message: "Missing reset of data pointer when block size changes in SDHCI emulation may lead to out-of-bounds access (CVE-2021-3409)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          case SDHC_BLKSIZE:
            if (!TRANSFERRING_DATA(...)) {
              ...
              MASKED_WRITE(s->blksize, ..., ...);
              ...
              if (extract32(s->blksize, 0, 12) > s->buf_maxsz) {
                ...
                s->blksize = deposit32(s->blksize, 0, 12, s->buf_maxsz);
              }
              ...
            }
            break;
      - pattern: |
          case SDHC_BLKSIZE:
            if (!TRANSFERRING_DATA(...)) {
              ...
              MASKED_WRITE(s->blksize, ..., ...);
              ...
              if (extract32(s->blksize, 0, 12) > s->buf_maxsz) {
                ...
                s->blksize = deposit32(s->blksize, 0, 12, s->buf_maxsz);
              }
            }
            break;
    metavariable-pattern:
      s: SDHCIState