rules:
  - id: cve-2015-7804-phar-zip-off-by-one
    message: "Off-by-one vulnerability in phar_parse_zipfile may lead to uninitialized pointer dereference (CVE-2015-7804, CWE-189)."
    severity: ERROR
    languages: [c]
    pattern: |
      if (HASH_KEY_IS_STRING != zend_hash_get_current_key_ex(...))
    metadata:
      cwe: ["CWE-189"]
      cve: "CVE-2015-7804"