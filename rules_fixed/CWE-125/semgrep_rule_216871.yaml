rules:
  - id: cve-2021-3712-asn1-string-not-null-terminated
    message: "Potential read buffer overrun due to assumption that ASN1_STRING data is NUL-terminated. Use '%.*s' with length instead of '%s'."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              BIO_printf(..., "%s", $ASN1_STRING->data);
          - pattern: |
              BIO_printf(..., "...%s...", $ASN1_STRING->data);
    metadata:
      cwe: "CWE-125"
      cve: "CVE-2021-3712"