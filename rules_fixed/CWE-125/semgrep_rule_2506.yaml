rules:
  - id: cve-2017-13688-olsr-buffer-overread
    message: "Missing bounds check before accessing OLSR message data may lead to buffer over-read (CWE-125)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          ND_TCHECK2(*tptr, sizeof(struct olsr_msg4));
          if (is_ipv6)
          {
              ...
          }
          else
          {
              ...
          }
      - pattern: |
          if (is_ipv6)
          {
              ...
          }
          else
          {
              ND_TCHECK2(*tptr, sizeof(struct olsr_msg4));
              ...
          }
    metavariable-pattern:
      metavariable: tptr
      pattern: $TPTR
    fixes:
      - regex: ND_TCHECK2\(\*tptr,\s*sizeof\(struct olsr_msg4\)\);
        replacement: ND_TCHECK2(*tptr, sizeof(struct olsr_msg4)); // Ensure bounds check is performed
    fix-regex:
      enabled: false