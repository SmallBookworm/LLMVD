rules:
  - id: cve-2014-7840-host-from-stream-offset-validation
    message: "Missing validation of offset against block->length in host_from_stream_offset may lead to arbitrary code execution (CVE-2014-7840)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if (flags & RAM_SAVE_FLAG_CONTINUE) {
              if (!block) {
                  ...
                  return NULL;
              }
              return memory_region_get_ram_ptr(block->mr) + offset;
          }
      - pattern-inside: |
          QTAILQ_FOREACH(block, &ram_list.blocks, next) {
            ...
          }
        pattern: |
          if (!strncmp(..., block->idstr, ...)) {
              return memory_region_get_ram_ptr(block->mr) + offset;
          }