rules:
  - id: openjpeg-out-of-bounds-include-access
    message: "Potential out-of-bounds access to pi->include array. Missing bounds check before array access."
    severity: ERROR
    languages: [c]
    pattern: |
      if (!pi->include[index]) {
        pi->include[index] = 1;
        return OPJ_TRUE;
      }
    metavariable-pattern:
      metavariable: index
      pattern-not: |
        if (index >= pi->include_size) {
          ...
          return OPJ_FALSE;
        }
        if (!pi->include[index]) {
          pi->include[index] = 1;
          return OPJ_TRUE;
        }