rules:
  - id: openjpeg-pi-include-oob-access
    message: "Potential out-of-bounds access to pi->include array. Missing bounds check before array access."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          index = ...;
          if (!pi->include[index]) { ... }
      - pattern: |
          index = ...;
          if (pi->include[index]) { ... }
      - pattern: |
          ... = pi->include[index];
      - pattern: |
          pi->include[index] = ...;
    metavariable-pattern:
      metavariable: index
      language: c
      pattern: |
        $L * $SL + $R * $SR + $C * $SC + $P * $SP
    focus-metavariable: index