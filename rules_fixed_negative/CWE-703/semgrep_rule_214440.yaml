rules:
  - id: freerdp-double-free-CVE-2020-4031
    message: "Double free vulnerability in shadow_server_start due to premature free(list) before all error paths are handled."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if (!list || (count <= 1))
          {
              free(list);
              if (server->ipcSocket == NULL)
              {
                  if (!open_port(...))
                      return -1;
              }
              else
                  return -1;
          }
    metadata:
      cwe: "CWE-703"
      cve: "CVE-2020-4031"