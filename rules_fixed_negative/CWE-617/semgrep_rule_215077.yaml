rules:
  - id: cwe-617-assertion-failure-denial-of-service
    message: "Use of assert for input validation can lead to denial of service (CWE-617). Replace with proper runtime validation."
    severity: ERROR
    languages: [c]
    pattern: |
      assert($X > 0);
    metadata:
      cwe: "CWE-617"
      cve: "CVE-2018-14044"