rules:
  - id: cwe-125-enc-untrusted-read-no-size-check
    message: "enc_untrusted_read does not validate that the return size is within the requested buffer size, leading to potential out-of-bounds reads (CWE-125)."
    severity: ERROR
    languages: [c]
    pattern: |
      ssize_t enc_untrusted_read(int fd, void *buf, size_t count) {
        return static_cast<ssize_t>(EnsureInitializedAndDispatchSyscall(...));
      }
    metadata:
      cwe: "CWE-125"
      cve: "CVE-2020-8942"