rules:
  - id: qemu-rom-copy-out-of-bounds-write
    message: "Potential out-of-bounds write in rom_copy due to missing check for rom->addr < addr"
    severity: ERROR
    languages: [c]
    pattern: |
      if (rom->addr > end) {
        break;
      }
    pattern-not: |
      if (rom->addr > end || rom->addr < addr) {
        break;
      }
    metavariable-regex:
      metavariable: $end
      regex: "addr \\+ size"