rules:
  - id: cve-2015-8879-odbc-wvarchar-handling
    message: "Missing handling of SQL_WVARCHAR with zero display size when ODBCVER < 0x0300, leading to potential denial of service (CVE-2015-8879)."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              if (result->values[...].coltype == SQL_WVARCHAR && displaysize == 0) {
                ...
              }
          - pattern-inside: |
              switch (result->values[...].coltype) {
                ...
                case SQL_WVARCHAR:
                  $STMTS
              }
            patterns:
              - pattern: |
                  if (result->values[...].coltype == SQL_WVARCHAR && displaysize == 0) {
                    ...
                  }
    metavariable-pattern:
      metavariable: $BODY
      pattern: |
        if (result->values[i].coltype == SQL_WVARCHAR && displaysize == 0) {
          result->values[i].coltype = SQL_WLONGVARCHAR;
          result->values[i].value = NULL;
          break;
        }
    pattern-not-inside: |
      #if defined(ODBCVER) && (ODBCVER >= 0x0300)
      ...
      #endif