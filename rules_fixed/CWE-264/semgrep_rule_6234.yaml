rules:
  - id: cve-2014-3160-svg-subresource-sop-bypass
    message: "SVG subresource requests are not properly restricted, allowing Same Origin Policy bypass. Missing check for SVG image chrome client and non-data URLs."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if (type != Resource::MainResource) {
              if (frame() && frame()->chromeClient().isSVGImageChromeClient() && !url.protocolIsData())
                  return false;
          }
      - pattern: |
          if (frame() && frame()->chromeClient().isSVGImageChromeClient() && !url.protocolIsData())
              return false;
    metavariable-pattern:
      metavariable: $TYPE
      patterns:
        - pattern: $TYPE
        - pattern-not: Resource::MainResource
      constraint: symbol
    pattern-not: |
      if (type != Resource::MainResource) {
          if (frame() && frame()->chromeClient().isSVGImageChromeClient() && !url.protocolIsData())
              return false;
      }