rules:
  - id: cve-2016-5104-insecure-bind
    message: Binding to INADDR_ANY exposes the service to remote attackers. Use INADDR_LOOPBACK instead to restrict to localhost.
    severity: HIGH
    languages: [c]
    patterns:
      - pattern: |
          $$saddr.sin_addr.s_addr = htonl(INADDR_ANY);
    metadata:
      cwe: "CWE-284"
      cve: "CVE-2016-5104"