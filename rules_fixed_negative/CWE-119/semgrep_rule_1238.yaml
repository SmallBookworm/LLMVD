rules:
  - id: unsafe_sprintf_usage
    patterns:
      - pattern: sprintf($BUF, "%s:%s", $URL, $PORT);
    message: "Use of unsafe sprintf may lead to buffer overflow. Prefer snprintf with explicit size limit."
    severity: ERROR
    languages: [c]
    metadata:
      cwe: "CWE-119"
      cve: "CVE-2014-4502"