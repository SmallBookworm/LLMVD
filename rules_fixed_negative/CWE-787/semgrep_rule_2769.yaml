rules:
  - id: oniguruma-cve-2017-9225
    message: "Stack buffer overflow in onigenc_unicode_get_case_fold_codes_by_str() due to missing validation of code point 0xFFFFFFFF. Upgrade to Oniguruma 6.2.1 or later."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              if (code == gcode)
                return &wordlist[key];
          - pattern: |
              if (code == gcode)
                 return &wordlist[key];
    metadata:
      cwe: "CWE-787: Out-of-bounds Write"
      cve: "CVE-2017-9225"
      references:
        - https://github.com/kkos/oniguruma/commit/166a6c3999bf06b4de0ab4ce6b088a468cc4029f