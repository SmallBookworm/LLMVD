rules:
  - id: imagemagick-tiff-heap-buffer-overread-cve-2019-11597
    message: "Heap-based buffer over-read in WriteTIFFImage due to missing exception check before TIFFWriteDirectory. This may lead to denial of service or information disclosure."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-not: |
          if (exception->severity > ErrorException)
            break;
          ...
          (void) TIFFWriteDirectory(tiff);
      - pattern-either:
          - pattern: |
              (void) TIFFWriteDirectory($TIFF);
              $IMAGE = SyncNextImageInList($IMAGE);
          - pattern: |
              (void) TIFFWriteDirectory($TIFF);
              $IMAGE = SyncNextImageInList(...);
    metadata:
      cwe: "CWE-125"
      cve: "CVE-2019-11597"
      references:
        - "https://github.com/ImageMagick/ImageMagick/issues/1555"
        - "https://github.com/ImageMagick/ImageMagick6/commit/1d6c036f0388d7857c725342f7212b60e39a14c1"