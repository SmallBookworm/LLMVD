rules:
  - id: use-after-free-event-bindings
    message: Use-after-free vulnerability due to accessing filter after it has been moved. The raw pointer `filter_weak` may dangle if `AddEventMatcher` fails or moves ownership.
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - patterns:
              - pattern: base::DictionaryValue* $FILTER_WEAK = $FILTER.get();
              - pattern-inside: |
                  ...
              - pattern: int $ID = g_event_filter.Get().AddEventMatcher(..., ParseEventMatcher(std::move($FILTER)));
              - pattern-inside: |
                  ...
              - pattern: *$FILTER_WEAK
    metadata:
      cwe: "CWE-416"
      cve: "CVE-2016-5156"