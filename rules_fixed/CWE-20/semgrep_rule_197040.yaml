    patterns:
      - pattern-either:
          - pattern: |
              if (volume) {
                num_images = dds_info.depth;
              }
              ...
              for (n = 0; n < num_images; n++) {
              }
          - pattern: |
              if (cubemap) {
                ...
                num_images = ...;
              }
              ...
              for (n = 0; n < num_images; n++) {
              }
