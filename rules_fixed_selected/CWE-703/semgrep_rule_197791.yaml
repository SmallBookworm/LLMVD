rules:
  - id: upx-cve-2020-27787
    message: "Missing null check for DT_SYMTAB before use may lead to segmentation fault (CVE-2020-27787)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          get_te32(&dynp0[-1+ x_sym].d_val)
      - pattern: |
          get_te64(&dynp0[-1+ x_sym].d_val)
    metavariable-pattern:
      metavariable: x_sym
      pattern-not: |
        !x_sym ? ... : ...