rules:
  - id: cve-2018-6086-double-eviction-use-after-free
    message: "Potential use-after-free due to double eviction in disk cache. Missing loop to skip child entries before Doom() may lead to dangling pointers."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              while ($..cond1 && $..cond2) {
                ...;
                $entry = $entry->next();
                if (!$to_doom->InUse())
                  $to_doom->Doom();
              }
          - pattern: |
              while ($..cond1 && $..cond2) {
                $to_doom = $entry->value();
                $entry = $entry->next();
                if (!$to_doom->InUse())
                  $to_doom->Doom();
              }
    metavariable-pattern:
      metavariable: $to_doom
      pattern: MemEntryImpl*
    focus-metavariable: $to_doom