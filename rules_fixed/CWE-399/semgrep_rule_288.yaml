rules:
  - id: libtasn1-infinite-recursion-cve-2016-4008
    message: "Missing bounds check before entering loop may lead to infinite recursion in _asn1_extract_der_octet (CVE-2016-4008)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - patterns:
        - pattern: |
            if (len2 == -1)
              counter_end = der_len - 2;
            else
              counter_end = der_len;
        - pattern: while (counter < counter_end)
      - patterns:
        - pattern: |
            if (len2 == -1)
              counter_end = der_len - 2;
            else
              counter_end = der_len;
        - pattern: ...
        - pattern: while (counter < counter_end)
    metadata:
      cwe: ["CWE-399"]
      vulnerability: "Denial of Service via Infinite Recursion"
      references:
        - "https://git.savannah.gnu.org/gitweb/?p=libtasn1.git;a=commit;h=f435825c0f527a8e52e6ffbc3ad0bc60531d537e"
        - "https://nvd.nist.gov/vuln/detail/CVE-2016-4008"