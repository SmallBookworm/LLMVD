rules:
  - id: cve-2017-13014-buffer-overread
    patterns:
      - pattern-either:
          - pattern: |
              if ($LEN < sizeof(*$PREP)) {
                return (-1);
              }
          - pattern: |
              if ($LEN < sizeof(*$PREP))
                return (-1);
    message: "Missing ND_TTEST(*prep) check may lead to buffer over-read (CVE-2017-13014, CWE-125)."
    severity: ERROR
    languages: [c]