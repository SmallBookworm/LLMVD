rules:
  - id: cve-2013-0166-null-pkey-check
    message: "Missing NULL check for 'pkey' before dereference in ASN1_item_verify may lead to denial of service (CVE-2013-0166)."
    severity: ERROR
    languages: [c]
    pattern: |
      if (!pkey->...)
    pattern-not: |
      if (!pkey)
        {
        ...
        return ...;
        }