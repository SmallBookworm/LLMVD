rules:
  - id: cwe-200-uninitialized-padding
    message: Uninitialized padding fields in netlink message structure may leak kernel memory.
    severity: WARNING
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              $t = NLMSG_DATA($nlh);
              $t->$field = ...;
          - pattern: |
              $t = NLMSG_DATA($nlh);
              ...
              $t->$field = ...;
      - metavariable-regex:
          metavariable: $field
          regex: tca_family
      - pattern-not: |
          $t = NLMSG_DATA($nlh);
          ...
          $t->tca__pad1 = 0;
          ...
          $t->tca__pad2 = 0;