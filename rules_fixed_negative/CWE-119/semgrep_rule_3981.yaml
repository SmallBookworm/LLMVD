rules:
  - id: imagemagick-compleximages-buffer-overflow
    message: "Heap-based buffer overflow in ComplexImages due to unsafe pixel access using images->columns/rows instead of Cr_image dimensions."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              for (y=0; y < (ssize_t) images->rows; y++)
              {
                ...
                Ar=GetCacheViewVirtualPixels(Ar_view,0,y,
                  MagickMax(Ar_image->columns,Cr_image->columns),1,exception);
                ...
                for (x=0; x < (ssize_t) images->columns; x++)
                {
                  ...
                }
              }
          - pattern: |
              for (y=0; y < (ssize_t) images->rows; y++)
              {
                ...
                Ar=GetCacheViewVirtualPixels(Ar_view,0,y,
                  MagickMax(...),1,exception);
                ...
                for (x=0; x < (ssize_t) images->columns; x++)
                {
                  ...
                }
              }
    metadata:
      cwe: "CWE-119"
      cve: "CVE-2019-13308"