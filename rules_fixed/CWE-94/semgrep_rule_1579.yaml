rules:
  - id: cve-2015-0231-use-after-free
    message: "Use-after-free vulnerability due to improper handling of duplicate numerical keys in unserialize. In object property handling, 'zend_symtable_find' should be replaced with 'zend_hash_find' to avoid reusing freed memory."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if (zend_symtable_find(ht, str, len, (void**)&old_data) == SUCCESS) {
              var_push_dtor(var_hash, old_data);
          }
    metadata:
      cwe: "CWE-94"
      cve: "CVE-2015-0231"