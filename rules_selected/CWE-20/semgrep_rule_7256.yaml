rules:
  - id: cve-2016-5222-omnibox-spoofing
    message: "Missing validation of virtual URL in main frame navigation may lead to Omnibox spoofing (CVE-2016-5222)."
    severity: WARNING
    languages: [c]
    pattern-either:
      - pattern: |
          if (!dest_url.is_valid() && !dest_url.is_empty()) {
            ...
            return false;
          }
      - pattern: |
          if (frame_tree_node->IsMainFrame()) {
            const GURL& virtual_url = entry.GetVirtualURL();
            if (!virtual_url.is_valid() && !virtual_url.is_empty()) {
              ...
              return false;
            }
          }
    metavariable-pattern:
      metavariable: $FUNC
      pattern-not-inside: |
        if (frame_tree_node->IsMainFrame()) {
          const GURL& virtual_url = entry.GetVirtualURL();
          if (!virtual_url.is_valid() && !virtual_url.is_empty()) {
            ...
            return false;
          }
        }
        ...
        if (!dest_url.is_valid() && !dest_url.is_empty()) {
          ...
          return false;
        }