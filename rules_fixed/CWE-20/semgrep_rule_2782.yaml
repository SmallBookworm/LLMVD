rules:
  - id: imagemagick-jng-writeblob-check
    message: "Missing null check before WriteBlob call may lead to assertion failure (CVE-2017-9142)"
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              if (...)
                (void) WriteBlob(..., length, chunk);
          - pattern: |
              (void) WriteBlob(..., length, chunk);
              if (length != 0)
                ...
    fix-regex:
      regex: ""
      replacement: ""
      count: 1