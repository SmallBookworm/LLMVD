rules:
  - id: freeradius-unix-password-expiration-check-missing
    message: "Missing check for password expiration in /etc/shadow may allow authentication with expired passwords."
    severity: ERROR
    languages: [c]
    metadata:
      cwe: "CWE-522"
      cve: "CVE-2011-4966"
    pattern-either:
      - pattern: |
          if (spwd && spwd->sp_expire > 0 &&
              ($TIME / 86400) > spwd->sp_expire) {
            ...
            return RLM_MODULE_REJECT;
          }
      - pattern-not: |
          if (spwd && spwd->sp_lstchg > 0 && spwd->sp_max >= 0 &&
              ($TIME / 86400) > (spwd->sp_lstchg + spwd->sp_max)) {
            ...
            return RLM_MODULE_REJECT;
          }