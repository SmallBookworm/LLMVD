rules:
  - id: cve-2017-6415-null-ptr-deref
    patterns:
      - pattern-either:
          - pattern: |
              $P4 = r_buf_get_at(...);
              ...
              ut8 opcode = *($P4++) & 0xff;
          - pattern: |
              $P4 = r_buf_get_at(...);
              ...
              ut8 opcode = *(++$P4) & 0xff;
    message: "Potential NULL pointer dereference due to missing check on p4 before dereference (CVE-2017-6415, CWE-476)."
    severity: ERROR
    languages: [c]