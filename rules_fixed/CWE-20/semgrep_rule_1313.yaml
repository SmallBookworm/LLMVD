rules:
  - id: cve-2014-2523-dccp-skb-header-pointer
    message: "Incorrect usage of skb_header_pointer may lead to stack memory overwrite. The fourth argument should be a buffer (e.g., &_dh), not a pointer variable (&dh)."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              $type $tmp;
              struct $t *$ptr;
              ...
              $ptr = skb_header_pointer(..., &$ptr);
          - pattern: |
              struct dccp_hdr $_dh, *$dh;
              ...
              $dh = skb_header_pointer(..., &$dh);
    metadata:
      cwe: ["CWE-20"]
      cve: "CVE-2014-2523"