rules:
  - id: cve-2019-11472-divide-by-zero-xwd-bitmap-bit-order
    message: "Missing validation for header.bitmap_bit_order may lead to divide-by-zero (CWE-369)."
    severity: ERROR
    languages: [c]
    pattern: |
      if ((header.bits_per_pixel == 0) || (header.bits_per_pixel > 32))
        ThrowReaderException(...);
      if (((header.bitmap_pad % 8) != 0) || (header.bitmap_pad > 32))
        ThrowReaderException(...);
    pattern-not: |
      if ((header.bitmap_bit_order != MSBFirst) &&
          (header.bitmap_bit_order != LSBFirst))
        ThrowReaderException(...);