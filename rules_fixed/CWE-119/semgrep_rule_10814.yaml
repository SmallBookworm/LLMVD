rules:
  - id: cve-2018-7752-buffer-overflow
    message: "Potential buffer overflow due to missing bounds check on op->layer_count before array access."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - patterns:
              - pattern: op->layer_count = gf_bs_read_u8(...);
              - pattern: for (j = 0; j < op->layer_count; j++) { op->layers_info[j]...; }
            metavariable-patterns:
              - metavariable: op
                pattern: $OP
          - patterns:
              - pattern: op->layer_count = gf_bs_read_u8(...);
              - pattern-inside: |
                  ...
                  for (j = 0; j < op->layer_count; j++) {
                    op->layers_info[j]...;
                  }
            metavariable-patterns:
              - metavariable: op
                pattern: $OP
      - pattern-not: |
          op->layer_count = gf_bs_read_u8(...);
          if (op->layer_count > sizeof(op->layers_info) / sizeof((op->layers_info)[0]))
            return;
          for (j = 0; j < op->layer_count; j++) {
            op->layers_info[j]...;
          }