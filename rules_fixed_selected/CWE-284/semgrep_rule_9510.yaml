rules:
  - id: imagemagick-viff-memory-allocation-check-missing
    message: Missing memory allocation overflow check before computing max_packets in ReadVIFFImage
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if (viff_info.data_storage_type == VFF_TYP_BIT)
            max_packets=((image->columns+7UL) >> 3UL)*image->rows;
          else
            max_packets=(size_t) (number_pixels*viff_info.number_data_bands);
      - pattern: |
          if (viff_info.data_storage_type == VFF_TYP_BIT)
            max_packets=((image->columns+7UL) >> 3UL)*image->rows;
          else
            max_packets=(size_t) (number_pixels * viff_info.number_data_bands);
    metadata:
      cwe: ["CWE-284"]
      cve: "CVE-2016-10065"