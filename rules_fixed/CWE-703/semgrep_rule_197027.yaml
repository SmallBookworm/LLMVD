    severity: WARNING
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              if (LocaleNCompare(PhotoshopProfile, $A, $B) == 0)
              {
                $C;
                count = (ssize_t) sscanf($D, PhotoshopProfile " %lu", &extent);
                if (count != 1)
                  continue;
                length = extent;
                profile = BlobToStringInfo((const void *) NULL, length);
                if (profile != (StringInfo *) NULL)
                {
                  $E;
                  for ($F = 0; $F < (ssize_t) length; $F++)
                    $G = (unsigned char) ProfileInteger($H, $I);
                  $J;
                }
                continue;
              }
    metadata:
      cwe: "CWE-703"
      cve: "CVE-2017-14172"