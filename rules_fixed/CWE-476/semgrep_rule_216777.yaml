rules:
  - id: cve-2020-1967-null-dereference
    message: |
      Potential NULL pointer dereference in tls1_check_sig_alg() when handling
      unsupported signature algorithms in TLS 1.3. This can lead to a crash
      (Denial of Service) if an invalid 'signature_algorithms_cert' extension
      is received from a peer. Ensure NULL return from tls1_lookup_sigalg()
      is checked before dereferencing.
    severity: ERROR
    languages: [c]
    pattern: |
      if (sig_nid == $SIGALG->sigandhash)
    pattern-not: |
      if ($SIGALG != NULL && sig_nid == $SIGALG->sigandhash)
    metavariable-pattern:
      $SIGALG:
        pattern-either:
          - pattern: tls1_lookup_sigalg(...)
          - pattern: s->shared_sigalgs[...]
    fix-regex:
      regex: ''
      replacement: ''