rules:
  - id: gnutls_cdk_pkt_read_overflow
    message: "Missing packet length validation before use may lead to heap-based buffer overflow (CWE-787)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          pkt->pktsize = pktsize + pktlen;
      - pattern: |
          #define NAME_SIZE (pkt->pktlen + ...)
    pattern-not-inside: |
      if (pktlen >= MAX_PACKET_LEN || pktsize >= MAX_PACKET_LEN) {
        ...
        return ...;
      }
      ...