rules:
  - id: cve-2017-5067-libyuv-copyplane-width-height-miscalculation
    message: "Potential spoofing vulnerability due to incorrect width/height calculation in libyuv::CopyPlane. Width must be in bytes, not pixels."
    severity: WARNING
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              libyuv::CopyPlane(...,
                  VideoFrame::Columns(..., ..., ...),
                  VideoFrame::Rows(..., ..., ...));
    metadata:
      cwe: ["CWE-20"]
      cve: "CVE-2017-5067"