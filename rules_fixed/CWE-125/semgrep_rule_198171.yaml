rules:
  - id: cwe-125-gf_m2ts_process_pmt-buffer-overread
    message: "Potential heap-based buffer over-read in gf_m2ts_process_pmt due to missing bounds check before accessing descriptor data. This can lead to denial of service via crafted MP4 file (CVE-2019-20630)."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              if (info_length != 0) {
                ...
                iod_bs = gf_bs_new((char *)data+8, len-2, GF_BITSTREAM_READ);
                ...
              }
          - pattern: |
              if (info_length != 0) {
                ...
                metadatapd_bs = gf_bs_new((char *)data+6, len, GF_BITSTREAM_READ);
                ...
              }
    metavariable-pattern:
      info_length: "((data[2]&0xf)<<8) | data[3]"