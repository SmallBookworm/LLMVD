rules:
  - id: imagemagick-write-map-memory-leak
    patterns:
      - pattern-either:
          - pattern: |
              if ((pixels == (unsigned char *) NULL) ||
                  (colormap == (unsigned char *) NULL))
                ThrowWriterException(...);
          - pattern: |
              if ((colormap == (unsigned char *) NULL) ||
                  (pixels == (unsigned char *) NULL))
                ThrowWriterException(...);
    message: "Memory leak vulnerability (CWE-401): allocated memory for 'colormap' or 'pixels' is not freed before throwing exception."
    severity: ERROR
    languages: [c]
    metadata:
      cwe: "CWE-401"
      cve: "CVE-2017-12663"