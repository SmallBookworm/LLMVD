    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          docs[$I]->getCatalog()->getPage($J)->...
      - pattern: |
          Ref *refPage = docs[$I]->getCatalog()->getPageRef(1);
          ...
          if (... && !refPage->...)