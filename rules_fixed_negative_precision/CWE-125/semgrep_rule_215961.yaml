rules:
  - id: cwe-125-out-of-bounds-read-idna_to_ascii_4i
    message: "Out-of-bounds read vulnerability in idna_to_ascii_4i due to missing free(src) before early return when input length exceeds 63 bytes."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              if (i < 64)
                out[i] = '\0';
              else
                return IDNA_INVALID_LENGTH;
          - pattern: |
              if (i < 64)
                out[i] = '\0';
              else
                return ...;
    metavariable-pattern:
      metavariable: i
      pattern: "..."