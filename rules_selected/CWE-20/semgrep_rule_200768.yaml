rules:
  - id: cve-2014-0239-dns-reply-check
    patterns:
      - pattern-not: |
          if (state->in_packet.operation & DNS_FLAG_REPLY) {
              ...
              tevent_req_werror(req, WERR_INVALID_PARAM);
              return tevent_req_post(req, ev);
          }
      - pattern-either:
          - pattern: |
              state->state.flags = state->in_packet.operation;
              state->state.flags |= DNS_FLAG_REPLY;
          - pattern: |
              state->out_packet = state->in_packet;
              switch (state->in_packet.operation & DNS_OPCODE) { ... }
    message: "DNS server does not check the QR (reply) bit before processing incoming packets, leading to potential DoS via reply loops (CVE-2014-0239)."
    severity: ERROR
    languages: [c]
    metadata:
      cwe: "CWE-20"
      cve: "CVE-2014-0239"