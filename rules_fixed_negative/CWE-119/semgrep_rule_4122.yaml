rules:
  - id: cve-2018-20855-uninitialized-stack-memory
    message: "mlx5_ib_create_qp_resp structure is not initialized, leading to potential stack memory leak to userspace."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern: |
          struct mlx5_ib_create_qp_resp $VAR;
          ...
          create_user_qp(..., &$VAR, ...);
    metadata:
      cwe: ["CWE-119"]
      cve: "CVE-2018-20855"