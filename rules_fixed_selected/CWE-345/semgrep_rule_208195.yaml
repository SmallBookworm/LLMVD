rules:
  - id: cwe-345-heimdal-orpheus-lyre
    message: "KDC-REP service name is taken from unencrypted 'ticket' instead of encrypted 'enc_part', enabling server impersonation (CVE-2017-11103)."
    severity: ERROR
    languages: [c]
    pattern: |
      _krb5_principalname2krb5_principal (
        ...,
        &tmp_principal,
        rep->kdc_rep.ticket.sname,
        rep->kdc_rep.ticket.realm
      )