rules:
  - id: freerdp-missing-input-check-filecontents-request
    patterns:
      - pattern-either:
          - pattern: |
              if (fileContentsRequest->dwFlags == FILECONTENTS_SIZE)
              {
                *((UINT32*)&pData[0]) = clipboard->fileDescriptor[fileContentsRequest->listIndex]->nFileSizeLow;
                *((UINT32*)&pData[4]) = clipboard->fileDescriptor[fileContentsRequest->listIndex]->nFileSizeHigh;
                ...
              }
          - pattern: |
              bRet = wf_cliprdr_get_file_contents(
                clipboard->file_names[fileContentsRequest->listIndex], ...);
    message: "Missing bounds check on fileContentsRequest->listIndex before accessing clipboard file arrays. This may lead to out-of-bounds access (CWE-20)."
    severity: ERROR
    languages: [c]
    metadata:
      cwe: "CWE-20"
      cve: "CVE-2021-37594"