rules:
  - id: cwe-125-out-of-bounds-read-libgd-dynamicgetbuf
    message: "Out-of-bounds read vulnerability in dynamicGetbuf due to missing bounds checks on dp->pos and rlen against dp->realSize."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          static int dynamicGetbuf(..., void *buf, int len)
          {
            ...
            remain = dp->logicalSize - dp->pos;
            ...
            memcpy(buf, (void *) ((char *)dp->data + dp->pos), rlen);
            ...
          }
      - pattern: |
          static int dynamicGetbuf(..., void *buf, int len)
          {
            ...
            if (remain >= len) {
              rlen = len;
            } else {
              ...
              rlen = remain;
            }
            memcpy(buf, (void *) ((char *)dp->data + dp->pos), rlen);
            ...
          }
    pattern-not: |
      static int dynamicGetbuf(..., void *buf, int len)
      {
        ...
        if (dp->pos < 0 || dp->pos >= dp->realSize) {
          return 0;
        }
        ...
        if (dp->pos + rlen > dp->realSize) {
          rlen = dp->realSize - dp->pos;
        }
        memcpy(buf, (void *) ((char *)dp->data + dp->pos), rlen);
        ...
      }