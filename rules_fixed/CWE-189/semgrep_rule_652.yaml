rules:
  - id: ext4_s_log_groups_per_flex_shift_overflow
    message: "Unsafe left shift of s_log_groups_per_flex may cause undefined behavior or bypass sanity checks (CVE-2012-2100)."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              $sbi->s_log_groups_per_flex = $sbi->s_es->s_log_groups_per_flex;
              ...
              $groups_per_flex = 1 << $sbi->s_log_groups_per_flex;
              if ($groups_per_flex < 2) { ... }
    metavariable-patterns:
      - metavariable: $sbi
        patterns:
          - pattern-either:
              - pattern: struct ext4_sb_info*
              - pattern: void*
              - pattern-inside: |
                  struct ext4_sb_info *$sbi = ...;
    metadata:
      cwe: ["CWE-189"]
      references:
        - https://github.com/torvalds/linux/commit/d50f2ab6f050311dbf7b8f5501b25f0bf64a439b
        - CVE-2012-2100