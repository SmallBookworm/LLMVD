rules:
  - id: cve-2016-3185-type-confusion-soap-cookies
    message: "Type confusion vulnerability in SOAP cookie handling may lead to memory disclosure or DoS. Ensure cookie path and domain are strings before comparison."
    severity: ERROR
    languages: [c]
    pattern: |
      if (((tmp = zend_hash_index_find(Z_ARRVAL_P(data), 1)) == NULL ||
           strncmp(phpurl->path?phpurl->path:"/",Z_STRVAL_P(tmp),Z_STRLEN_P(tmp)) == 0) &&
          ((tmp = zend_hash_index_find(Z_ARRVAL_P(data), 2)) == NULL ||
           in_domain(phpurl->host,Z_STRVAL_P(tmp))) &&
          (use_ssl || (tmp = zend_hash_index_find(Z_ARRVAL_P(data), 3)) == NULL))
    pattern-not: |
      if (((tmp = zend_hash_index_find(Z_ARRVAL_P(data), 1)) == NULL ||
           Z_TYPE_P(tmp) != IS_STRING ||
           strncmp(phpurl->path?phpurl->path:"/",Z_STRVAL_P(tmp),Z_STRLEN_P(tmp)) == 0) &&
          ((tmp = zend_hash_index_find(Z_ARRVAL_P(data), 2)) == NULL ||
           Z_TYPE_P(tmp) != IS_STRING ||
           in_domain(phpurl->host,Z_STRVAL_P(tmp))) &&
          (use_ssl || (tmp = zend_hash_index_find(Z_ARRVAL_P(data), 3)) == NULL))
    fix-regex:
      regex: '(\(\(tmp = zend_hash_index_find\(Z_ARRVAL_P\(data\), ([12])\)\) == NULL \|\|.*?)(strncmp|in_domain)'
      replacement: '($1 Z_TYPE_P(tmp) != IS_STRING || $3'
    metadata:
      cwe: "CWE-20"
      cve: "CVE-2016-3185"
      references:
        - https://git.php.net/?p=php-src.git;a=commit;h=eaf4e77190d402ea014207e9a7d5da1a4f3727ba