rules:
  - id: wavpack-rf64-buffer-overread
    message: "Potential stack-based buffer over-read in RF64 file parsing due to unchecked chunk size when reading DS64 chunk."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if (chunk_header.ckSize < sizeof (DS64Chunk) ||
             !DoReadFile (infile, &ds64_chunk, chunk_header.ckSize, &bcount) ||
             bcount != chunk_header.ckSize)
      - pattern: |
          if (chunk_header.ckSize < sizeof (DS64Chunk) ||
             !DoReadFile (infile, &ds64_chunk, chunk_header.ckSize, &bcount) ||
             bcount != chunk_header.ckSize)
    fix-regex:
      regex: 'chunk_header\\.ckSize'
      replacement: 'sizeof (DS64Chunk)'