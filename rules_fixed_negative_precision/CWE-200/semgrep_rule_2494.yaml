rules:
  - id: cve-2017-13694-acpi-ps-complete-final-op-no-cache-flush
    message: "Missing cache flush in acpi_ps_complete_final_op may leak kernel memory (CVE-2017-13694, CWE-200)."
    severity: HIGH
    languages: [c]
    pattern-either:
      - pattern: |
          if (WalkState->AscendingCallback != NULL)
          {
              ...
              if (Status == AE_CTRL_TERMINATE)
              {
                  Status = AE_OK;
                  /* Clean up */
                  do
                  {
                      ...
                  } while (Op);
                  return_ACPI_STATUS (Status);
              }
              ...
          }
      - pattern: |
          if (WalkState->AscendingCallback != NULL)
          {
              ...
              else if (ACPI_FAILURE (Status))
              {
                  /* First error is most important */
                  (void) AcpiPsCompleteThisOp (WalkState, Op);
                  return_ACPI_STATUS (Status);
              }
              ...
          }