rules:
  - id: cve-2013-0923-missing-any-orientation-check
    message: Missing check for 'any' orientation may lead to memory corruption (CVE-2013-0923, CWE-119).
    severity: HIGH
    languages: [c]
    pattern-either:
      - pattern: |
          if (orientationString == portrait)
              return ...;
          if (orientationString == landscape)
              return ...;
      - pattern: |
          if (orientationString == landscape)
              return ...;
          if (orientationString == portrait)
              return ...;
    metavariable-pattern:
      metavariable: orientationString
      pattern: $X
    focus-metavariable: orientationString