rules:
  - id: mbedtls-buffer-overflow-sni
    patterns:
      - pattern-either:
          - pattern: |
              if( (size_t)(end - p) < ... )
              {
                ...
              }
          - pattern: |
              if( (size_t)(end - p) < ... )
