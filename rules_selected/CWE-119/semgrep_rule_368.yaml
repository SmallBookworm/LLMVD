rules:
  - id: cve-2016-2342-bgp-vpnv4-buffer-overflow
    message: "Unsafe memcpy in bgp_nlri_parse_vpnv4 may lead to stack-based buffer overflow (CVE-2016-2342, CWE-119). Missing bounds checks before copying packet data into fixed-size buffer."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          memcpy (&p.u.prefix, pnt + 11, psize - 11);
      - pattern: |
          memcpy (&p.u.prefix, pnt + $OFFSET, psize - $OFFSET);
    metavariable-pattern:
      $OFFSET:
        pattern-eq: "11"