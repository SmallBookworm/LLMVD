rules:
  - id: vhdx-missing-bounds-check
    message: Missing bounds check for block_size and logical_sector_size in VHDX parser may lead to infinite loops (CVE-2014-0148, CWE-835).
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if (s->logical_sector_size == 0 || s->params.block_size == 0) {
            ...
          }
      - pattern: |
          s->sectors_per_block = s->params.block_size / s->logical_sector_size;
          ...
          if (s->logical_sector_size & (s->logical_sector_size - 1)) {
            ...
          }
    metavariable-regex:
      metavariable: $...
      regex: .*?