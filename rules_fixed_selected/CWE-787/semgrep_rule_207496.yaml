rules:
  - id: re2c_heap_buffer_overflow_CVE-2020-11958
    message: "Heap-based buffer overflow in Scanner::fill due to incorrect pointer shift calculation (CVE-2020-11958, CWE-787)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          shift_ptrs_and_fpos(buf - bot);
      - pattern: |
          shift_ptrs_and_fpos(-static_cast<ptrdiff_t>(free));
    metavariable-regex:
      metavariable: $buf
      regex: "buf"