rules:
  - id: cve-2015-8660-overlayfs-setattr-bypass
    message: "OverlayFS setattr bypass vulnerability (CVE-2015-8660): missing permission check due to unsafe optimization in ovl_setattr."
    severity: WARNING
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              if (upperdentry) {
                ...
                notify_change(upperdentry, attr, NULL);
                ...
              } else {
                ovl_copy_up_last(..., attr, ...);
              }
          - pattern: |
              if (upperdentry) {
                mutex_lock(...);
                notify_change(upperdentry, attr, NULL);
                mutex_unlock(...);
              } else {
                ovl_copy_up_last(..., attr, ...);
              }
    metavariable-regex:
      metavariable: upperdentry
      regex: 'upperdentry'