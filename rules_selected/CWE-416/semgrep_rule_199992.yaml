rules:
  - id: cve-2020-10720-use-after-free-gro
    message: "Use-after-free vulnerability in napi_frags_skb due to unsafe eth header access after gro_pull_from_frag0. This may lead to crashes or memory corruption (CVE-2020-10720, CWE-416)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          eth = skb_gro_header_fast(skb, 0);
          ...
          gro_pull_from_frag0(skb, hlen);
          ...
          skb->protocol = eth->h_proto;
    metadata:
      cwe: ["CWE-416"]
      cve: "CVE-2020-10720"
      references:
        - https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/commit/?id=a4270d6795b0580287453ea55974d948393e66ef