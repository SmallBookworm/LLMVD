rules:
  - id: cwe-787-buffer-overflow-parsechars
    patterns:
      - pattern-either:
          - pattern: |
              if (out >= MAXSTRING) {
                result->length = out;
                return 1;
              }
              result->chars[out++] = (widechar)ch;
          - pattern: |
              result->chars[out++] = (widechar)ch;
              if (out >= MAXSTRING) {
                result->length = out;
                return 1;
              }
    message: "Potential stack-based buffer overflow due to missing bounds check before writing to result->chars. Ensure index is validated before assignment."
    severity: ERROR
    languages: [c]