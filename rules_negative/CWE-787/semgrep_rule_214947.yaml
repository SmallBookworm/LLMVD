rules:
  - id: can_gw_dlc_overflow
    message: "Missing check for can_dlc exceeding available CAN frame data size after modification, leading to potential out-of-bounds write (CVE-2019-3701)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if (modidx) {
            ...
            if (gwj->mod.csumfunc.crc8)
                (*gwj->mod.csumfunc.crc8)(..., ...);
            ...
          }
      - pattern: |
          if (modidx) {
            ...
            if (gwj->mod.csumfunc.xor)
                (*gwj->mod.csumfunc.xor)(..., ...);
            ...
          }
    metavariable-regex:
      metavariable: modidx
      regex: modidx
    pattern-not-inside: |
      if (modidx) {
        ...
        int max_len = ...;
        if (cf->can_dlc > max_len)
            goto out_delete;
        ...
        if (gwj->mod.csumfunc.crc8) {
            if (cf->can_dlc > 8)
                goto out_delete;
            ...
        }
        ...
        if (gwj->mod.csumfunc.xor) {
            if (cf->can_dlc > 8)
                goto out_delete;
            ...
        }
        ...
      }