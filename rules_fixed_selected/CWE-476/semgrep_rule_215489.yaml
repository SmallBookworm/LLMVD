rules:
  - id: udp_msg_probe_null_deref
    message: "Potential NULL pointer dereference in udp_sendmsg due to MSG_PROBE without proper write queue check. This may lead to privilege escalation or denial of service (CVE-2009-2698)."
    severity: ERROR
    languages: [c]
    pattern: |
      if (err)
        udp_flush_pending_frames(sk);
      else if (!corkreq)
        err = udp_push_pending_frames(sk, up);
      release_sock(sk);
    pattern-not: |
      if (err)
        udp_flush_pending_frames(sk);
      else if (!corkreq)
        err = udp_push_pending_frames(sk, up);
      else if (unlikely(skb_queue_empty(&sk->sk_write_queue)))
        up->pending = 0;
      release_sock(sk);