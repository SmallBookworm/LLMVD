rules:
  - id: cwe-415-double-free-gpac-av1
    message: "Potential double-free vulnerability in gf_av1_reset_state due to conditional call to gf_bs_get_content_no_truncate that may lead to use-after-free or double-free (CVE-2021-40572)."
    severity: ERROR
    languages: [c]
    pattern: |
      if (state->bs) {
        if (gf_bs_get_position(state->bs)) {
          ...
          gf_bs_get_content_no_truncate(...);
        }
        gf_bs_del(state->bs);
      }