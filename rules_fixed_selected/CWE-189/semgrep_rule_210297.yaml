rules:
  - id: bzip2-integer-overflow-CVE-2010-0405
    message: "Potential integer overflow in BZ2_decompress due to missing bounds check on variable 'N' before multiplication. This may lead to denial of service or arbitrary code execution (CVE-2010-0405, CWE-189)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          do {
            ...
            $N = $N * 2;
            ...
          } while (...);
      - pattern: |
          do {
            ...
            $N *= 2;
            ...
          } while (...);
    pattern-not-inside: |
      do {
        ...
        if ($N >= 2*1024*1024) RETURN(...);
        ...
        $N = $N * 2;
        ...
      } while (...);
    pattern-inside: |
      static Int32 BZ2_decompress ( DState* s )
      {
        ...
        case BZ_X_MAGIC_1:
        ...
        while (True) {
          ...
          if (nextSym == BZ_RUNA || nextSym == BZ_RUNB) {
            ...
            do {
              ...
              $N = $N * 2;
              ...
            } while (nextSym == BZ_RUNA || nextSym == BZ_RUNB);
            ...
          }
          ...
        }
        ...
      }