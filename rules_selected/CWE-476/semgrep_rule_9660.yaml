rules:
  - id: cve-2017-9608-null-deref-dnxhd
    message: "Potential NULL pointer dereference due to returning invalid negative value on error in dnxhd_find_frame_end()."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if (dctx->remaining <= 0)
              return dctx->remaining;
      - pattern: |
          if ($X <= 0)
              return $X;
    metavariable-pattern:
      metavariable: $X
      pattern: dctx->remaining