rules:
  - id: imagemagick-xwd-memory-leak-cve-2017-11166
    message: "Missing overflow check before allocating memory for colormap in XWD image reader may lead to memory exhaustion (CVE-2017-11166, CWE-772)."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          length=(size_t) $HEADER.ncolors;
          $COLORS=(XColor *) AcquireQuantumMemory(length,sizeof(*$COLORS));
      - pattern: |
          length=(size_t) $HEADER->ncolors;
          $COLORS=(XColor *) AcquireQuantumMemory(length,sizeof(*$COLORS));
    metavariable-pattern:
      metavariable: $HEADER
      pattern-regex: "header"