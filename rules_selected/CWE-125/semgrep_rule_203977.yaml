rules:
  - id: cwe-125-oniguruma-pfetch-without-pend-check
    message: "Heap-based buffer over-read due to missing PEND check before PFETCH in fetch_interval_quantifier"
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          if (IS_SYNTAX_OP($ENV->syntax, ONIG_SYN_OP_ESC_BRACE_INTERVAL)) {
            if ($C != MC_ESC($ENV->syntax)) goto invalid;
            PFETCH($C);
          }
    metadata:
      cwe: ["CWE-125"]
      references:
        - "https://github.com/kkos/oniguruma/commit/6eb4aca6a7f2f60f473580576d86686ed6a6ebec"
        - "https://nvd.nist.gov/vuln/detail/CVE-2019-19204"