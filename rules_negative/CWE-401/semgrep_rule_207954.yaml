rules:
  - id: rds_conn_create_memory_leak
    patterns:
      - pattern-either:
          - pattern: |
              if (trans->t_prefer_loopback) {
                  if (likely(is_outgoing)) {
                      ...
                  } else {
                      kmem_cache_free(rds_conn_slab, conn);
                      conn = ERR_PTR(...);
                      goto out;
                  }
              }
    message: "Memory leak in __rds_conn_create(): conn->c_path is not freed when loop_trans != 0, trans->t_prefer_loopback != 0, and is_outgoing == 0."
    severity: ERROR
    languages: [c]
    metadata:
      cwe: "CWE-401"
      cve: "CVE-2021-45480"