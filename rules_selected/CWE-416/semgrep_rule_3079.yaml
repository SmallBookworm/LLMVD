rules:
  - id: cve-2017-8294-use-after-free
    message: "Potential use-after-free vulnerability in YARA regex parser (CVE-2017-8294). The loop identifier is freed before being set to NULL, which can lead to a dangling pointer."
    severity: ERROR
    languages: [c]
    pattern-either:
      - pattern: |
          yr_free($ID);
          ...
          compiler->loop_identifier[$INDEX] = NULL;
      - pattern: |
          compiler->loop_identifier[$INDEX] = NULL;
          ...
          yr_free($ID);
    metadata:
      cwe: "CWE-416"
      cve: "CVE-2017-8294"
      references:
        - "https://github.com/VirusTotal/yara/commit/890c3f850293176c0e996a602ffa88b315f4e98f"