rules:
  - id: cve-2019-12360-buffer-overread
    message: "Potential stack-based buffer over-read in dumpString due to off-by-one error when checking buffer bounds."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              if (unlikely($LENGTH >= (int)sizeof($BUFFER))) {
                ...
                $LENGTH = sizeof($BUFFER) - 1;
              }
              dumpString($BUFFER, $LENGTH, ...);
          - pattern: |
              if (unlikely($LENGTH >= $BUFFER_LENGTH)) {
                ...
                $LENGTH = $BUFFER_LENGTH - 1;
              }
              dumpString($BUFFER, $LENGTH, ...);