rules:
  - id: mwifiex_buffer_overflow_wmm_get_status
    message: "Potential heap-based buffer overflow in mwifiex_ret_wmm_get_status due to missing length check before memcpy."
    severity: ERROR
    languages: [c]
    patterns:
      - pattern-either:
          - pattern: |
              memcpy((u8 *) &priv->curr_bss_params.bss_descriptor.wmm_ie, wmm_param_ie,
                     wmm_param_ie->vend_hdr.len + 2);
          - pattern: |
              memcpy((u8 *)&priv->curr_bss_params.bss_descriptor.wmm_ie, wmm_param_ie,
                     wmm_param_ie->vend_hdr.len + 2);
    pattern-not-inside: |
      if (wmm_param_ie->vend_hdr.len + 2 > sizeof(struct ieee_types_wmm_parameter))
          break;
      ...
      memcpy(..., wmm_param_ie, wmm_param_ie->vend_hdr.len + 2);
    metadata:
      cwe: "CWE-787"